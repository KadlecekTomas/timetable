[project]
name = "timetable-solver"
version = "0.1.0"
description = "Solver service for school timetable generation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.139.2",
  "ortools==9.15.6755",
  "pydantic==2.11.7",
  "uvicorn[standard]==0.35.0"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "ruff==0.12.10"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 140
exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
