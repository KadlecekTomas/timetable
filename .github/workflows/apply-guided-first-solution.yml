name: Apply guided first-solution solver strategy

on:
  push:
    branches:
      - agent/feasibility-first-solver

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/feasibility-first-solver
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply targeted patch
        run: python scripts/apply-guided-first-solution.py
      - name: Install formatter
        run: npm ci
      - name: Format touched files
        run: npx prettier --write apps/web/lib/local/api.ts apps/web/tests/generation-seed.test.ts apps/web/e2e/school-scale.spec.ts
      - name: Syntax check
        run: python -m py_compile apps/solver/app/main.py apps/solver/tests/test_solve.py
      - name: Commit production patch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/solver/app/main.py apps/solver/tests/test_solve.py apps/web/lib/local/api.ts apps/web/tests/generation-seed.test.ts apps/web/e2e/school-scale.spec.ts
          git rm scripts/apply-guided-first-solution.py .github/workflows/apply-guided-first-solution.yml
          git commit -m "Guide first solution and diversify retries"
          git push origin HEAD:agent/feasibility-first-solver
