name: Patch Phase 4 import cache

on:
  push:
    branches:
      - fix/phase4-legacy-2027-import

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase4-legacy-2027-import
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch stale failed-preview reuse and add regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('apps/web/lib/local/api.ts')
          text = api.read_text()
          old = '["READY", "VALIDATION_FAILED", "APPLIED"].includes(batch.status),'
          new = 'batch.status === "READY",'
          if old in text:
              text = text.replace(old, new, 1)
              api.write_text(text)
          elif new not in text:
              raise SystemExit('Expected import cache condition was not found')

          test = Path('apps/web/tests/local-api-import-cache.test.ts')
          test.write_text('''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import path from "node:path";
          import test from "node:test";

          test("failed import previews are always reanalyzed", async () => {
            const source = await readFile(
              path.join(process.cwd(), "lib", "local", "api.ts"),
              "utf8",
            );

            assert.match(source, /batch\\.status === "READY"/);
            assert.doesNotMatch(
              source,
              /\\["READY", "VALIDATION_FAILED", "APPLIED"\\]\\.includes\\(batch\\.status\\)/,
            );
          });
          ''')
          PY
      - name: Format regression test
        run: npx prettier --write apps/web/tests/local-api-import-cache.test.ts
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/local/api.ts apps/web/tests/local-api-import-cache.test.ts
          git commit -m "fix(import): reanalyze failed Excel previews"
          git push origin HEAD:fix/phase4-legacy-2027-import
