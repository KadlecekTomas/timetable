name: Patch full curriculum gate

on:
  push:
    branches:
      - feat/client-friendly-excel-template

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-friendly-excel-template
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: python scripts/patch_full_curriculum_gate.py
      - run: npx prettier --write apps/web/e2e/full-curriculum.spec.ts .github/workflows/ci.yml
      - run: rm scripts/patch_full_curriculum_gate.py .github/workflows/zz-patch-full-curriculum.yml
      - name: Commit generated release gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/full-curriculum.spec.ts .github/workflows/ci.yml scripts/patch_full_curriculum_gate.py .github/workflows/zz-patch-full-curriculum.yml
          git commit -m "test: cover full second-stage curriculum export"
          git push origin HEAD:feat/client-friendly-excel-template
