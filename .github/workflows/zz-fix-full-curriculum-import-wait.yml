name: Fix full curriculum import wait

on:
  push:
    branches:
      - feat/client-friendly-excel-template

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-friendly-excel-template
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Wait for committed IndexedDB import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/e2e/full-curriculum.spec.ts')
          lines = path.read_text().splitlines()
          needle = '  await page.getByRole("button", { name: "Bezpečně uložit změny" }).click();'
          matches = [index for index, line in enumerate(lines) if line == needle]
          if len(matches) != 1:
              raise SystemExit(f'Expected one save click, got {len(matches)}')
          insert_at = matches[0] + 1
          inserted = [
              '  await expect(',
              '    page.getByRole("heading", { name: "Data byla bezpečně uložena" }),',
              '  ).toBeVisible();',
              '  await expect',
              '    .poll(async () => (await readProject(page)).teachers.length)',
              '    .toBe(40);',
          ]
          lines[insert_at:insert_at] = inserted
          path.write_text('\n'.join(lines) + '\n')
          PY
      - run: npx prettier --write apps/web/e2e/full-curriculum.spec.ts
      - run: rm .github/workflows/zz-fix-full-curriculum-import-wait.yml scripts/.fix-full-curriculum-import-wait-trigger scripts/.fix-full-curriculum-import-wait-trigger-2
      - name: Commit import wait fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/full-curriculum.spec.ts .github/workflows/zz-fix-full-curriculum-import-wait.yml scripts/.fix-full-curriculum-import-wait-trigger scripts/.fix-full-curriculum-import-wait-trigger-2
          git commit -m "fix: wait for full curriculum import commit"
          git push origin HEAD:feat/client-friendly-excel-template
