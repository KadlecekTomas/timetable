name: Agent staffing range entry

on:
  push:
    branches:
      - agent/fix-project-delete-and-school-groups

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-project-delete-and-school-groups
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Add quick availability ranges
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/web/app/staffing/page.tsx')
          text = path.read_text()
          old = '''                  <p className="mt-1 text-sm text-text-secondary">
                    Označte jednotlivé vyučovací hodiny, kdy tento učitel nemůže
                    učit na 2. stupni. Solver do modrých polí nikdy nic
                    neumístí. Číslování odpovídá 1., 2., 3. vyučovací hodině
                    atd.
                  </p>
                  <div className="mt-3 overflow-x-auto rounded-xl border border-border">
'''
          new = '''                  <p className="mt-1 text-sm text-text-secondary">
                    Nejrychleji zadejte souvislý rozsah „od–do“ pro každý den,
                    například Pondělí 1.–6. hodina. Jednotlivá modrá pole pod tím
                    můžete dál ručně zapnout nebo vypnout pro výjimky. Solver do
                    blokovaných hodin nikdy nic neumístí.
                  </p>
                  <div className="mt-4 grid gap-3 md:grid-cols-2 xl:grid-cols-5">
                    {STAFFING_DAYS.map((day) => {
                      const wholeDay = teacher.unavailableDays.includes(day.code);
                      const periods = periodsPerDay[day.dayIndex] ?? 0;
                      const selectedExactCount = (
                        teacher.unavailablePeriods ?? []
                      ).filter((item) => item.day === day.code).length;
                      return (
                        <form
                          key={`range-${day.code}`}
                          onSubmit={(event) => {
                            event.preventDefault();
                            if (wholeDay || periods <= 0) return;
                            const form = new FormData(event.currentTarget);
                            const rawFrom = numberValue(
                              String(form.get("from") ?? "1"),
                            );
                            const rawTo = numberValue(
                              String(form.get("to") ?? String(periods)),
                            );
                            const from = Math.max(
                              1,
                              Math.min(periods, Math.min(rawFrom, rawTo)),
                            );
                            const to = Math.max(
                              1,
                              Math.min(periods, Math.max(rawFrom, rawTo)),
                            );
                            updateTeacher(teacher.id, (current) => {
                              if (current.unavailableDays.includes(day.code)) {
                                return current;
                              }
                              const nextPeriods = new Map(
                                (current.unavailablePeriods ?? []).map((item) => [
                                  `${item.day}:${item.period}`,
                                  item,
                                ]),
                              );
                              for (
                                let period = from - 1;
                                period <= to - 1;
                                period += 1
                              ) {
                                nextPeriods.set(`${day.code}:${period}`, {
                                  day: day.code as StaffingDayCode,
                                  period,
                                });
                              }
                              return {
                                ...current,
                                unavailablePeriods: [...nextPeriods.values()],
                              };
                            });
                          }}
                          className="rounded-xl border border-border bg-surface-subtle p-3"
                        >
                          <div className="flex items-center justify-between gap-2">
                            <span className="text-sm font-semibold text-text-primary">
                              {day.shortLabel}
                            </span>
                            <span className="text-xs text-text-muted">
                              {wholeDay
                                ? "celý den"
                                : `${selectedExactCount} blok.`}
                            </span>
                          </div>
                          <div className="mt-2 grid grid-cols-[1fr_auto_1fr] items-end gap-2">
                            <label className="space-y-1 text-xs font-medium text-text-secondary">
                              Od
                              <select
                                name="from"
                                aria-label={`${day.shortLabel} blokovat od`}
                                defaultValue="1"
                                disabled={wholeDay}
                                className="h-9 w-full rounded-md border border-border-strong bg-surface px-2 text-sm text-text-primary"
                              >
                                {Array.from({ length: periods }, (_, period) => (
                                  <option key={period} value={period + 1}>
                                    {period + 1}.
                                  </option>
                                ))}
                              </select>
                            </label>
                            <span className="pb-2 text-sm text-text-muted">–</span>
                            <label className="space-y-1 text-xs font-medium text-text-secondary">
                              Do
                              <select
                                name="to"
                                aria-label={`${day.shortLabel} blokovat do`}
                                defaultValue={String(Math.min(6, periods))}
                                disabled={wholeDay}
                                className="h-9 w-full rounded-md border border-border-strong bg-surface px-2 text-sm text-text-primary"
                              >
                                {Array.from({ length: periods }, (_, period) => (
                                  <option key={period} value={period + 1}>
                                    {period + 1}.
                                  </option>
                                ))}
                              </select>
                            </label>
                          </div>
                          <div className="mt-2 flex gap-2">
                            <button
                              type="submit"
                              aria-label={`${day.shortLabel} blokovat rozsah`}
                              disabled={wholeDay || periods <= 0}
                              className="flex-1 rounded-md bg-primary px-2 py-2 text-xs font-semibold text-primary-foreground disabled:cursor-not-allowed disabled:opacity-50"
                            >
                              Blokovat rozsah
                            </button>
                            <button
                              type="button"
                              aria-label={`${day.shortLabel} vyčistit blokované hodiny`}
                              disabled={wholeDay || selectedExactCount === 0}
                              onClick={() =>
                                updateTeacher(teacher.id, (current) => ({
                                  ...current,
                                  unavailablePeriods: (
                                    current.unavailablePeriods ?? []
                                  ).filter((item) => item.day !== day.code),
                                }))
                              }
                              className="rounded-md border border-border-strong bg-surface px-2 py-2 text-xs font-semibold text-text-secondary disabled:cursor-not-allowed disabled:opacity-50"
                            >
                              Vyčistit
                            </button>
                          </div>
                        </form>
                      );
                    })}
                  </div>
                  <div className="mt-4 overflow-x-auto rounded-xl border border-border">
'''
          if old not in text:
              raise SystemExit('availability UI anchor not found')
          path.write_text(text.replace(old, new, 1))

          test_path = Path('apps/web/e2e/staffing.spec.ts')
          test = test_path.read_text()
          old_test = '''  const tuesdayThird = page.getByRole("button", {
    name: "Út 3. hodina volná",
  });
  await expect(tuesdayThird).toBeVisible();
  await tuesdayThird.click();
  await expect(
    page.getByRole("button", { name: "Út 3. hodina blokovaná" }),
  ).toHaveAttribute("aria-pressed", "true");
'''
          new_test = '''  await page.getByLabel("Út blokovat od").selectOption("1");
  await page.getByLabel("Út blokovat do").selectOption("6");
  await page.getByRole("button", { name: "Út blokovat rozsah" }).click();
  for (let period = 1; period <= 6; period += 1) {
    await expect(
      page.getByRole("button", {
        name: `Út ${period}. hodina blokovaná`,
      }),
    ).toHaveAttribute("aria-pressed", "true");
  }
'''
          if old_test not in test:
              raise SystemExit('staffing e2e click anchor not found')
          test = test.replace(old_test, new_test, 1)
          test = test.replace(
              '"Hotovo. Uloženo 1 učitelů a 9 tvrdých blokací dostupnosti."',
              '"Hotovo. Uloženo 1 učitelů a 14 tvrdých blokací dostupnosti."',
              1,
          )
          test = test.replace(
              'expect(stored.project.availability).toHaveLength(9);',
              'expect(stored.project.availability).toHaveLength(14);',
              1,
          )
          old_some = '''  expect(
    stored.project.availability.some(
      (rule) =>
        rule.entityType === "TEACHER" &&
        rule.dayOfWeek === 1 &&
        rule.period === 2 &&
        rule.kind === "UNAVAILABLE",
    ),
  ).toBe(true);
'''
          new_some = '''  const tuesdayRules = stored.project.availability.filter(
    (rule) => rule.dayOfWeek === 1,
  );
  expect(tuesdayRules).toHaveLength(6);
  expect(tuesdayRules.map((rule) => rule.period).sort()).toEqual([0, 1, 2, 3, 4, 5]);
  expect(
    tuesdayRules.every(
      (rule) => rule.entityType === "TEACHER" && rule.kind === "UNAVAILABLE",
    ),
  ).toBe(true);
'''
          if old_some not in test:
              raise SystemExit('staffing project assertion anchor not found')
          test = test.replace(old_some, new_some, 1)
          old_periods = '''  expect(stored.staffingPlan.teachers[0]!.unavailablePeriods).toEqual([
    { day: "TUE", period: 2 },
  ]);
'''
          new_periods = '''  expect(stored.staffingPlan.teachers[0]!.unavailablePeriods).toEqual([
    { day: "TUE", period: 0 },
    { day: "TUE", period: 1 },
    { day: "TUE", period: 2 },
    { day: "TUE", period: 3 },
    { day: "TUE", period: 4 },
    { day: "TUE", period: 5 },
  ]);
'''
          if old_periods not in test:
              raise SystemExit('staffing localStorage assertion anchor not found')
          test_path.write_text(test.replace(old_periods, new_periods, 1))
          PY
          npx prettier --write apps/web/app/staffing/page.tsx apps/web/e2e/staffing.spec.ts
      - name: Verify web gate
        shell: bash
        run: |
          npm run format:check
          npm run lint --workspace @timetable/web
          npm run typecheck --workspace @timetable/web
          npm run test --workspace @timetable/web
      - name: Commit verified source changes and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-staffing-range-entry.yml
          git add apps/web/app/staffing/page.tsx apps/web/e2e/staffing.spec.ts
          git commit -m "feat: add quick teacher availability ranges"
          git push origin HEAD:agent/fix-project-delete-and-school-groups
