name: Agent staffing range entry

on:
  push:
    branches:
      - agent/fix-project-delete-and-school-groups

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-project-delete-and-school-groups
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Apply quick availability ranges
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply.py
          python /tmp/apply.py
          npx prettier --write apps/web/app/staffing/page.tsx apps/web/e2e/staffing.spec.ts
      - name: Verify web gate
        shell: bash
        run: |
          npm run format:check
          npm run lint --workspace @timetable/web
          npm run typecheck --workspace @timetable/web
          npm run test --workspace @timetable/web
      - name: Commit verified source changes and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-staffing-range-entry.yml
          git add apps/web/app/staffing/page.tsx apps/web/e2e/staffing.spec.ts
          git commit -m "feat: add quick teacher availability ranges"
          git push origin HEAD:agent/fix-project-delete-and-school-groups
