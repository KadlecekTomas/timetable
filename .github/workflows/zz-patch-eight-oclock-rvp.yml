name: Patch eight o'clock and RVP coverage

on:
  push:
    branches:
      - feat/client-friendly-excel-template

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-friendly-excel-template
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm install
      - run: python scripts/patch_eight_oclock_and_rvp_coverage.py
      - run: npx prettier --write apps/web/lib/domain/school-day.ts apps/web/lib/domain/class-groups.ts apps/web/lib/domain/validation.ts apps/web/app/timetable/page.tsx apps/web/lib/export/timetable-workbook.ts apps/web/lib/import/client-workbook.ts apps/web/lib/import/client-workbook-prefill.ts apps/web/e2e/full-curriculum.spec.ts apps/web/tests/school-day.test.ts apps/web/tests/timetable-workbook.test.ts apps/web/tests/school-client-workbook.test.ts
      - run: python -m pip install ruff
      - run: ruff format apps/solver/app/class_groups.py apps/solver/app/main.py apps/solver/app/validator.py apps/solver/tests/test_school_day_rules.py
      - run: rm scripts/patch_eight_oclock_and_rvp_coverage.py .github/workflows/zz-patch-eight-oclock-rvp.yml scripts/.patch-eight-oclock-rvp-trigger
      - name: Commit hard school start and full RVP mapping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: require regular classes to start at 8:00"
          git push origin HEAD:feat/client-friendly-excel-template
