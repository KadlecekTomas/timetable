name: Retire one-shot integration patchers

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Remove completed one-shot patch infrastructure
        run: |
          rm -f \
            .github/scripts/patch_school_scale_shared.py \
            .github/scripts/patch_school_template_shared.py \
            .github/scripts/patch_shared_import.py \
            .github/scripts/patch_shared_local.py \
            .github/scripts/patch_shared_solver.py \
            .github/scripts/patch_shared_template_tests.py \
            .github/scripts/patch_shared_template_copy_assertion.py \
            .github/scripts/patch_shared_validation.py \
            .github/workflows/apply-czech-school-day-rules.yml \
            .github/workflows/apply-shared-solver.yml \
            .github/workflows/apply-shared-validation.yml \
            .github/workflows/apply-shared-web.yml \
            .github/workflows/integrate-realistic-school.yml \
            .github/workflows/patch-school-client-template.yml \
            .github/workflows/cleanup-one-shot-patchers.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: remove completed one-shot patchers"
          git push origin HEAD:${{ github.head_ref }}
