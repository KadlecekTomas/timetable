name: Agent format branch

on:
  push:
    branches: [agent/leadership-ux-gate]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/leadership-ux-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Format changed UI files
        run: >-
          npx prettier --write
          apps/web/app/page.tsx
          apps/web/e2e/dashboard-workflow.spec.ts
          apps/web/e2e/leadership-ux.spec.ts
          apps/web/lib/ui-labels.ts
      - name: Commit exact Prettier output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/page.tsx apps/web/e2e/dashboard-workflow.spec.ts apps/web/e2e/leadership-ux.spec.ts apps/web/lib/ui-labels.ts
          git commit -m "chore: format leadership UX changes"
          git push origin HEAD:agent/leadership-ux-gate
