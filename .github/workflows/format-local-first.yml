name: Format local-first implementation

on:
  push:
    branches: [feat/local-first-indexeddb]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-first-indexeddb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write apps/web .github/workflows/ci.yml vercel.json
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web .github/workflows/ci.yml vercel.json
          git commit -m "style: format local-first implementation"
          git push origin HEAD:feat/local-first-indexeddb
