name: Agent exact teacher unavailability

on:
  push:
    branches:
      - agent/fix-project-delete-and-school-groups

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-project-delete-and-school-groups
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Patch exact unavailable periods
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Missing block in {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          # Staffing model: preserve whole-day availability and add exact unavailable slots.
          path = 'apps/web/lib/local/staffing-plan.ts'
          replace(
              path,
              'export type StaffingDayCode = (typeof STAFFING_DAYS)[number]["code"];\n',
              '''export type StaffingDayCode = (typeof STAFFING_DAYS)[number]["code"];

          export interface StaffingUnavailablePeriod {
            day: StaffingDayCode;
            /** Zero-based lesson period within the school day. */
            period: number;
          }
          ''',
          )
          replace(
              path,
              '  unavailableDays: StaffingDayCode[];\n}',
              '''  unavailableDays: StaffingDayCode[];
            /** Exact hard-unavailable periods, e.g. because the teacher teaches on primary school. */
            unavailablePeriods?: StaffingUnavailablePeriod[];
          }''',
          )
          replace(
              path,
              '    unavailableDays: [],\n  };',
              '    unavailableDays: [],\n    unavailablePeriods: [],\n  };',
          )
          replace(
              path,
              '''      unavailableDays: Array.isArray(teacher.unavailableDays)
                ? teacher.unavailableDays.filter((day): day is StaffingDayCode =>
                    STAFFING_DAYS.some((option) => option.code === day),
                  )
                : [],
            })),''',
              '''      unavailableDays: Array.isArray(teacher.unavailableDays)
                ? teacher.unavailableDays.filter((day): day is StaffingDayCode =>
                    STAFFING_DAYS.some((option) => option.code === day),
                  )
                : [],
              unavailablePeriods: Array.isArray(teacher.unavailablePeriods)
                ? [
                    ...new Map(
                      teacher.unavailablePeriods.flatMap((item) => {
                        if (!item || typeof item !== "object") return [];
                        const candidate = item as Partial<StaffingUnavailablePeriod>;
                        if (
                          !STAFFING_DAYS.some(
                            (option) => option.code === candidate.day,
                          ) ||
                          !Number.isInteger(candidate.period) ||
                          Number(candidate.period) < 0 ||
                          Number(candidate.period) > 19
                        ) {
                          return [];
                        }
                        const normalized = {
                          day: candidate.day as StaffingDayCode,
                          period: Number(candidate.period),
                        };
                        return [
                          [`${normalized.day}:${normalized.period}`, normalized] as const,
                        ];
                      }),
                    ).values(),
                  ].sort((left, right) => {
                    const leftDay = STAFFING_DAYS.findIndex(
                      (item) => item.code === left.day,
                    );
                    const rightDay = STAFFING_DAYS.findIndex(
                      (item) => item.code === right.day,
                    );
                    return leftDay - rightDay || left.period - right.period;
                  })
                : [],
            })),''',
          )

          # Staffing UI and sync.
          path = 'apps/web/app/staffing/page.tsx'
          replace(
              path,
              'const unsavedNavigationMessage =\n  "Máte neuložené změny u učitelů. Opravdu chcete stránku opustit?";\n',
              '''const unsavedNavigationMessage =
            "Máte neuložené změny u učitelů. Opravdu chcete stránku opustit?";
          const DEFAULT_PERIODS_PER_DAY = [8, 8, 8, 8, 7];
          ''',
          )
          replace(
              path,
              '''    subjectLoads: teacher.subjectLoads,
                unavailableDays: teacher.unavailableDays,
              });''',
              '''    subjectLoads: teacher.subjectLoads,
                unavailableDays: teacher.unavailableDays,
                unavailablePeriods: teacher.unavailablePeriods ?? [],
              });''',
          )
          replace(
              path,
              '  const [loaded, setLoaded] = useState(false);\n',
              '''  const [loaded, setLoaded] = useState(false);
            const [periodsPerDay, setPeriodsPerDay] = useState<number[]>(
              DEFAULT_PERIODS_PER_DAY,
            );
          ''',
          )
          replace(
              path,
              '''  useEffect(() => {
                const stored = loadStaffingPlan();
                setPlan(stored);
                setSavedPlan(stored);
                setLoaded(true);
              }, []);
          ''',
              '''  useEffect(() => {
                const stored = loadStaffingPlan();
                setPlan(stored);
                setSavedPlan(stored);
                setLoaded(true);
              }, []);

              useEffect(() => {
                let active = true;
                void (async () => {
                  try {
                    const response = await localApiFetch(`/api/school-years/${schoolYearId}`);
                    if (!response.ok) return;
                    const payload = (await response.json()) as Partial<SchoolYearResponse>;
                    if (
                      active &&
                      Array.isArray(payload.periodsPerDay) &&
                      payload.periodsPerDay.length >= 5
                    ) {
                      setPeriodsPerDay(
                        payload.periodsPerDay.map((value, dayIndex) =>
                          Number.isInteger(value) && Number(value) > 0
                            ? Number(value)
                            : (DEFAULT_PERIODS_PER_DAY[dayIndex] ?? 8),
                        ),
                      );
                    }
                  } catch {
                    // Local-first fallback stays on the school default period counts.
                  }
                })();
                return () => {
                  active = false;
                };
              }, [schoolYearId]);
          ''',
          )
          replace(
              path,
              '''  const unavailableDays = plan.teachers.reduce(
                (total, teacher) => total + teacher.unavailableDays.length,
                0,
              );
          ''',
              '''  const unavailableDays = plan.teachers.reduce(
                (total, teacher) => total + teacher.unavailableDays.length,
                0,
              );
              const unavailablePeriods = plan.teachers.reduce(
                (total, teacher) => total + (teacher.unavailablePeriods?.length ?? 0),
                0,
              );
          ''',
          )
          old_tasks = '''      const availabilityTasks = plan.teachers.flatMap((teacher) => {
                const teacherCode = codes.get(teacher.id)!;
                const teacherId = teacherIdByCode.get(teacherCode);
                if (!teacherId) return [];
                return teacher.unavailableDays.flatMap((dayCode) => {
                  const day = STAFFING_DAYS.find((item) => item.code === dayCode)!;
                  const periods = schoolYear.periodsPerDay[day.dayIndex] ?? 0;
                  return Array.from({ length: periods }, (_, period) => ({
                    teacher,
                    teacherId,
                    day,
                    period,
                  }));
                });
              });
          '''
          new_tasks = '''      const availabilityTasks = plan.teachers.flatMap((teacher) => {
                const teacherCode = codes.get(teacher.id)!;
                const teacherId = teacherIdByCode.get(teacherCode);
                if (!teacherId) return [];
                const slots = new Map<
                  string,
                  {
                    teacher: StaffingTeacher;
                    teacherId: string;
                    day: (typeof STAFFING_DAYS)[number];
                    period: number;
                    reason: string;
                  }
                >();

                for (const dayCode of teacher.unavailableDays) {
                  const day = STAFFING_DAYS.find((item) => item.code === dayCode);
                  if (!day) continue;
                  const periods = schoolYear.periodsPerDay[day.dayIndex] ?? 0;
                  for (let period = 0; period < periods; period += 1) {
                    slots.set(`${day.code}:${period}`, {
                      teacher,
                      teacherId,
                      day,
                      period,
                      reason: `${teacher.firstName} ${teacher.lastName} nemůže celý den ${day.label.toLocaleLowerCase("cs-CZ")}.`,
                    });
                  }
                }

                for (const unavailable of teacher.unavailablePeriods ?? []) {
                  const day = STAFFING_DAYS.find(
                    (item) => item.code === unavailable.day,
                  );
                  if (!day || teacher.unavailableDays.includes(day.code)) continue;
                  const periods = schoolYear.periodsPerDay[day.dayIndex] ?? 0;
                  if (unavailable.period < 0 || unavailable.period >= periods) continue;
                  slots.set(`${day.code}:${unavailable.period}`, {
                    teacher,
                    teacherId,
                    day,
                    period: unavailable.period,
                    reason: `${teacher.firstName} ${teacher.lastName}: pevná nedostupnost ${day.label.toLocaleLowerCase("cs-CZ")} ${unavailable.period + 1}. hodinu (např. výuka na 1. stupni).`,
                  });
                }

                return [...slots.values()];
              });
          '''
          replace(path, old_tasks, new_tasks)
          replace(
              path,
              '          `Ukládám nedostupné dny ${index + 1}/${availabilityTasks.length}…`,',
              '          `Ukládám nedostupné hodiny ${index + 1}/${availabilityTasks.length}…`,',
          )
          replace(
              path,
              '              reason: `${task.teacher.firstName} ${task.teacher.lastName} nemůže celý den ${task.day.label.toLocaleLowerCase("cs-CZ")}.`,',
              '              reason: task.reason,',
          )
          replace(
              path,
              '''      setMessage(
                `Hotovo. Uloženo ${plan.teachers.length} učitelů včetně celých nedostupných dnů.`,
              );''',
              '''      setMessage(
                `Hotovo. Uloženo ${plan.teachers.length} učitelů a ${availabilityTasks.length} tvrdých blokací dostupnosti.`,
              );''',
          )
          replace(
              path,
              '        description="Zapište základní úvazek, případný nadúvazek, rozdělení hodin mezi předměty a celé dny, kdy učitel nemůže. Každou kartu uložte samostatně."',
              '        description="Zapište úvazek, předměty a přesné časy, kdy učitel nemůže — třeba protože učí na 1. stupni. Celé dny i jednotlivé hodiny jsou tvrdé blokace pro solver."',
          )
          replace(
              path,
              '''          ["Celé nedostupné dny", unavailableDays],
                ].map(([label, value]) => (''',
              '''          ["Celé nedostupné dny", unavailableDays],
                  ["Konkrétní blokované hodiny", unavailablePeriods],
                ].map(([label, value]) => (''',
          )
          replace(
              path,
              '      <section className="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">',
              '      <section className="grid gap-3 sm:grid-cols-2 xl:grid-cols-5">',
          )
          whole_toggle_old = '''                              ...current,
                              unavailableDays: selected
                                ? current.unavailableDays.filter(
                                    (item) => item !== day.code,
                                  )
                                : [
                                    ...current.unavailableDays,
                                    day.code as StaffingDayCode,
                                  ],
                            }))'''
          whole_toggle_new = '''                              ...current,
                              unavailableDays: selected
                                ? current.unavailableDays.filter(
                                    (item) => item !== day.code,
                                  )
                                : [
                                    ...current.unavailableDays,
                                    day.code as StaffingDayCode,
                                  ],
                              unavailablePeriods: selected
                                ? (current.unavailablePeriods ?? [])
                                : (current.unavailablePeriods ?? []).filter(
                                    (item) => item.day !== day.code,
                                  ),
                            }))'''
          replace(path, whole_toggle_old, whole_toggle_new)
          exact_ui = '''

                <div>
                  <h4 className="font-semibold text-text-primary">
                    Konkrétní hodiny — 1. stupeň / pevný závazek
                  </h4>
                  <p className="mt-1 text-sm text-text-secondary">
                    Označte jednotlivé vyučovací hodiny, kdy tento učitel nemůže
                    učit na 2. stupni. Solver do modrých polí nikdy nic neumístí.
                    Číslování odpovídá 1., 2., 3. vyučovací hodině atd.
                  </p>
                  <div className="mt-3 overflow-x-auto rounded-xl border border-border">
                    <div className="min-w-[680px] p-3">
                      {STAFFING_DAYS.map((day) => {
                        const wholeDay = teacher.unavailableDays.includes(day.code);
                        const periods = periodsPerDay[day.dayIndex] ?? 0;
                        return (
                          <div
                            key={`periods-${day.code}`}
                            className="grid grid-cols-[72px_repeat(8,minmax(58px,1fr))] gap-2 border-b border-border py-2 last:border-b-0"
                          >
                            <div className="flex items-center text-sm font-semibold text-text-primary">
                              {day.shortLabel}
                            </div>
                            {Array.from({ length: 8 }, (_, period) => {
                              if (period >= periods) {
                                return <div key={period} aria-hidden="true" />;
                              }
                              const exactSelected = (teacher.unavailablePeriods ?? []).some(
                                (item) =>
                                  item.day === day.code && item.period === period,
                              );
                              const blocked = wholeDay || exactSelected;
                              return (
                                <button
                                  key={period}
                                  type="button"
                                  aria-label={`${day.shortLabel} ${period + 1}. hodina ${blocked ? "blokovaná" : "volná"}`}
                                  aria-pressed={blocked}
                                  disabled={wholeDay}
                                  title={
                                    wholeDay
                                      ? `${day.label}: celý den je už blokovaný`
                                      : `${day.label} ${period + 1}. hodina`
                                  }
                                  onClick={() =>
                                    updateTeacher(teacher.id, (current) => {
                                      const currentPeriods = current.unavailablePeriods ?? [];
                                      const selectedNow = currentPeriods.some(
                                        (item) =>
                                          item.day === day.code &&
                                          item.period === period,
                                      );
                                      return {
                                        ...current,
                                        unavailablePeriods: selectedNow
                                          ? currentPeriods.filter(
                                              (item) =>
                                                !(
                                                  item.day === day.code &&
                                                  item.period === period
                                                ),
                                            )
                                          : [
                                              ...currentPeriods,
                                              {
                                                day: day.code as StaffingDayCode,
                                                period,
                                              },
                                            ],
                                      };
                                    })
                                  }
                                  className={
                                    blocked
                                      ? "rounded-md bg-primary px-2 py-2 text-xs font-semibold text-primary-foreground disabled:cursor-not-allowed disabled:opacity-70"
                                      : "rounded-md border border-border-strong bg-surface px-2 py-2 text-xs font-semibold text-text-secondary hover:bg-surface-subtle"
                                  }
                                >
                                  {period + 1}. h
                                </button>
                              );
                            })}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
          '''
          marker = '''                {hasProblem ? (
                  <div className="rounded-xl border border-danger-border bg-danger-subtle p-4">'''
          replace(path, marker, exact_ui + '\n' + marker)
          replace(
              path,
              '''          Jednotlivé zakázané hodiny, preference konkrétních časů, minimum a
          maximum úvazku nebo technické kódy se řeší později. V základním kroku
          je záměrně neukazujeme.''',
              '''          Preference doporučených časů, minimum a maximum úvazku nebo technické
          kódy se řeší později. Tvrdé zakázané hodiny učitele už nastavíte přímo
          v jeho kartě.''',
          )

          # E2E: exact slot survives save and becomes a hard availability rule.
          path = 'apps/web/e2e/staffing.spec.ts'
          replace(
              path,
              '''  await expect(page.getByRole("button", { name: "Po nemůže" })).toHaveAttribute(
            "aria-pressed",
            "true",
          );
          ''',
              '''  await expect(page.getByRole("button", { name: "Po nemůže" })).toHaveAttribute(
            "aria-pressed",
            "true",
          );

          const tuesdayThird = page.getByRole("button", {
            name: "Út 3. hodina volná",
          });
          await expect(tuesdayThird).toBeVisible();
          await tuesdayThird.click();
          await expect(
            page.getByRole("button", { name: "Út 3. hodina blokovaná" }),
          ).toHaveAttribute("aria-pressed", "true");
          ''',
          )
          replace(
              path,
              '''    page.getByText("Hotovo. Uloženo 1 učitelů včetně celých nedostupných dnů."),''',
              '''    page.getByText("Hotovo. Uloženo 1 učitelů a 9 tvrdých blokací dostupnosti."),''',
          )
          replace(path, '  expect(stored.project.availability).toHaveLength(8);', '  expect(stored.project.availability).toHaveLength(9);')
          replace(
              path,
              '''  expect(
            stored.project.availability.every(
              (rule) =>
                rule.entityType === "TEACHER" &&
                rule.dayOfWeek === 0 &&
                rule.kind === "UNAVAILABLE",
            ),
          ).toBe(true);
          ''',
              '''  const mondayRules = stored.project.availability.filter(
            (rule) => rule.dayOfWeek === 0,
          );
          expect(mondayRules).toHaveLength(8);
          expect(
            mondayRules.every(
              (rule) =>
                rule.entityType === "TEACHER" && rule.kind === "UNAVAILABLE",
            ),
          ).toBe(true);
          expect(
            stored.project.availability.some(
              (rule) =>
                rule.entityType === "TEACHER" &&
                rule.dayOfWeek === 1 &&
                rule.period === 2 &&
                rule.kind === "UNAVAILABLE",
            ),
          ).toBe(true);
          ''',
          )
          replace(
              path,
              '''            unavailableDays: string[];
            subjectLoads: Array<{''',
              '''            unavailableDays: string[];
            unavailablePeriods?: Array<{ day: string; period: number }>;
            subjectLoads: Array<{''',
          )
          replace(
              path,
              '  expect(stored.staffingPlan.teachers[0]!.unavailableDays).toEqual(["MON"]);',
              '''  expect(stored.staffingPlan.teachers[0]!.unavailableDays).toEqual(["MON"]);
          expect(stored.staffingPlan.teachers[0]!.unavailablePeriods).toEqual([
            { day: "TUE", period: 2 },
          ]);''',
          )
          PY
          npx prettier --write apps/web/lib/local/staffing-plan.ts apps/web/app/staffing/page.tsx apps/web/e2e/staffing.spec.ts .github/workflows/agent-exact-teacher-unavailability.yml
      - name: Verify web gate
        shell: bash
        run: |
          npm run format:check
          npm run lint --workspace @timetable/web
          npm run typecheck --workspace @timetable/web
          npm run test --workspace @timetable/web
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/local/staffing-plan.ts apps/web/app/staffing/page.tsx apps/web/e2e/staffing.spec.ts
          git commit -m "feat: add exact teacher unavailability slots"
          git push origin HEAD:agent/fix-project-delete-and-school-groups
