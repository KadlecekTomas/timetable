name: Format real workbook browser test

on:
  push:
    branches:
      - fix/real-2027-import-crash

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/real-2027-import-crash
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write apps/web/e2e/real-2027-upload.spec.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/real-2027-upload.spec.ts
          git commit -m "style: format real workbook browser test"
          git push origin HEAD:fix/real-2027-import-crash
