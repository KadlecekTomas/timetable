name: Fix full curriculum types

on:
  push:
    branches:
      - feat/client-friendly-excel-template

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-friendly-excel-template
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Fix class order map typing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/e2e/full-curriculum.spec.ts')
          source = path.read_text()
          old = '  const classOrder = new Map(\n'
          new = '  const classOrder = new Map<string, number>(\n'
          if source.count(old) != 1:
              raise SystemExit(f'Expected one classOrder map, got {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
      - run: npx prettier --write apps/web/e2e/full-curriculum.spec.ts
      - run: rm .github/workflows/zz-fix-full-curriculum-types.yml scripts/.fix-full-curriculum-types-trigger
      - name: Commit type fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/full-curriculum.spec.ts .github/workflows/zz-fix-full-curriculum-types.yml scripts/.fix-full-curriculum-types-trigger
          git commit -m "fix: type full curriculum class ordering"
          git push origin HEAD:feat/client-friendly-excel-template
