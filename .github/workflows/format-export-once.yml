name: Format export once

on:
  push:
    branches:
      - feat/client-friendly-excel-template

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-friendly-excel-template
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Format export files
        run: |
          npx prettier --write \
            apps/web/components/page-header.tsx \
            apps/web/e2e/timetable-export.spec.ts \
            apps/web/lib/export/timetable-workbook.ts \
            apps/web/tests/timetable-workbook.test.ts
          rm .github/workflows/format-export-once.yml
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/page-header.tsx \
            apps/web/e2e/timetable-export.spec.ts \
            apps/web/lib/export/timetable-workbook.ts \
            apps/web/tests/timetable-workbook.test.ts \
            .github/workflows/format-export-once.yml
          git commit -m "style(export): format leadership workbook implementation"
          git push origin HEAD:feat/client-friendly-excel-template
