name: Assemble client workbook
on:
  push:
    branches: [feat/client-friendly-excel-template]
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-friendly-excel-template
      - name: Assemble module
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          parts = sorted(Path('.tmp/client-workbook').glob('*.part'))
          data = ''.join(part.read_text() for part in parts)
          target = Path('apps/web/lib/import/client-workbook.ts')
          target.write_bytes(gzip.decompress(base64.b64decode(data)))
          PY
          rm -rf .tmp/client-workbook
      - name: Commit module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/web/lib/import/client-workbook.ts .tmp
          git commit -m "feat: add client-friendly Czech Excel workbook"
          git push origin HEAD:feat/client-friendly-excel-template
