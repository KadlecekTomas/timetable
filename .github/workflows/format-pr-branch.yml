name: Format PR branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/current-school-curriculum-splits'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run format
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/domain/coverage-overview.ts apps/web/lib/local/teaching-plan-school-v3.ts apps/web/tests/mandatory-school-splits.test.ts apps/web/tests/partial-split-generation.test.ts
          git commit -m "style: format curriculum split changes"
          git push origin HEAD:${{ github.head_ref }}
