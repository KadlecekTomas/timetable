name: Apply shared-class web and acceptance support

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply web model, Excel, storage and acceptance patches
        run: |
          python .github/scripts/patch_shared_validation.py
          python .github/scripts/patch_shared_import.py
          python .github/scripts/patch_shared_local.py
          python .github/scripts/patch_school_scale_shared.py
          python .github/scripts/patch_shared_template_tests.py
          python .github/scripts/patch_shared_template_copy_assertion.py
      - run: npx prettier --write apps/web
      - run: npm run typecheck --workspace @timetable/web
      - run: npm run test --workspace @timetable/web
      - name: Commit shared-class web support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web
          git commit -m "feat: connect shared classes through Excel, storage and editor"
          git push origin HEAD:${{ github.head_ref }}
