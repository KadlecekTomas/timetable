name: Patch synchronized rotations core once

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm install
      - name: Patch solver rotation objective and web contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              content = path.read_text()
              if new in content:
                  print(f"Already patched: {path}")
                  return
              if old not in content:
                  raise SystemExit(f"Expected fragment not found in {path}: {old[:160]}")
              path.write_text(content.replace(old, new, 1))

          main = Path("apps/solver/app/main.py")
          replace_once(
              main,
              '''from app.class_groups import (
              assignment_class_ids,
              class_required_weekly_periods,
              parallel_assignment_pairs,
          )'''.replace("          ", ""),
              '''from app.class_groups import (
              assignment_class_ids,
              class_required_weekly_periods,
              parallel_assignment_pairs,
              rotation_assignment_legs,
          )'''.replace("          ", ""),
          )
          rotation_insert_anchor = '''                model.add(
                    sum(left_at_position) == sum(right_at_position)
                )

    for assignment in payload.assignments:'''
          rotation_insert = '''                model.add(
                    sum(left_at_position) == sum(right_at_position)
                )

    rotation_horizon = max(payload.periods_per_day)
    for rotation_key, leg_1, leg_2 in rotation_assignment_legs(payload.assignments):
        leg_1_blocks = sorted(
            blocks_by_assignment[leg_1[0].id],
            key=lambda item: item.index,
        )
        leg_2_blocks = sorted(
            blocks_by_assignment[leg_2[0].id],
            key=lambda item: item.index,
        )
        if [item.duration for item in leg_1_blocks] != [
            item.duration for item in leg_2_blocks
        ]:
            raise HTTPException(
                status_code=422,
                detail={
                    "code": "ROTATION_SHAPE_MISMATCH",
                    "message": (
                        "Obě ramena výměny předmětů musí mít stejné rozložení hodin."
                    ),
                    "causes": [
                        {
                            "entityIds": [
                                leg_1[0].id,
                                leg_1[1].id,
                                leg_2[0].id,
                                leg_2[1].id,
                            ]
                        }
                    ],
                },
            )
        for block_index, (leg_1_block, leg_2_block) in enumerate(
            zip(leg_1_blocks, leg_2_blocks, strict=True)
        ):
            leg_1_position = model.new_int_var(
                0,
                len(payload.periods_per_day) * rotation_horizon - 1,
                f"rotation_position_{rotation_key}_1_{block_index}",
            )
            leg_2_position = model.new_int_var(
                0,
                len(payload.periods_per_day) * rotation_horizon - 1,
                f"rotation_position_{rotation_key}_2_{block_index}",
            )
            model.add(
                leg_1_position
                == sum(
                    variable
                    * (candidate.day * rotation_horizon + candidate.period)
                    for candidate, variable in variables[leg_1_block.id]
                )
            )
            model.add(
                leg_2_position
                == sum(
                    variable
                    * (candidate.day * rotation_horizon + candidate.period)
                    for candidate, variable in variables[leg_2_block.id]
                )
            )
            spread = model.new_int_var(
                1,
                len(payload.periods_per_day) * rotation_horizon - 1,
                f"rotation_spread_{rotation_key}_{block_index}",
            )
            model.add_abs_equality(spread, leg_1_position - leg_2_position)
            objective_terms.append(spread * payload.weights.rotation_spread)

    for assignment in payload.assignments:'''
          replace_once(main, rotation_insert_anchor, rotation_insert)

          contracts = Path("apps/web/lib/domain/contracts.ts")
          replace_once(
              contracts,
              'export type LessonShape = "SINGLE" | "DOUBLE" | "MIXED";\n',
              'export type LessonShape = "SINGLE" | "DOUBLE" | "MIXED";\nexport type ClassProfile = "REGULAR" | "SPORTS" | "CUSTOM";\n',
          )
          replace_once(
              contracts,
              '''export interface SnapshotClass {
              id: string;
              code: string;
              name: string;
              grade: number;
          }'''.replace("          ", ""),
              '''export interface SnapshotClass {
              id: string;
              code: string;
              name: string;
              grade: number;
              profile?: ClassProfile;
          }'''.replace("          ", ""),
          )
          replace_once(
              contracts,
              '''  min_day_gap?: number | null;
          }'''.replace("          ", ""),
              '''  min_day_gap?: number | null;
              parallel_key?: string | null;
              rotation_key?: string | null;
              rotation_leg?: 1 | 2 | null;
          }'''.replace("          ", ""),
          )
          replace_once(
              contracts,
              '''  late_period: number;
          }'''.replace("          ", ""),
              '''  late_period: number;
              rotation_spread: number;
          }'''.replace("          ", ""),
          )

          class_groups = Path("apps/web/lib/domain/class-groups.ts")
          replace_once(
              class_groups,
              'const key = `${assignmentClassIds(assignment).sort().join("|")}::${assignment.subject_id}`;',
              'const synchronizationKey = assignment.parallel_key || `subject:${assignment.subject_id}`;\n    const key = `${assignmentClassIds(assignment).sort().join("|")}::${synchronizationKey}`;',
          )

          api = Path("apps/web/lib/local/api.ts")
          replace_once(
              api,
              '''  late_period: 1,
          };'''.replace("          ", ""),
              '''  late_period: 1,
              rotation_spread: 75,
          };'''.replace("          ", ""),
          )
          replace_once(
              api,
              '''interface LocalClass {
              id: string;
              code: string;
              grade: number;
              name: string;
          }'''.replace("          ", ""),
              '''interface LocalClass {
              id: string;
              code: string;
              grade: number;
              name: string;
              profile: "REGULAR" | "SPORTS" | "CUSTOM";
          }'''.replace("          ", ""),
          )
          replace_once(
              api,
              '''  minDayGap: number | null;
          }'''.replace("          ", ""),
              '''  minDayGap: number | null;
              parallelKey: string | null;
              rotationKey: string | null;
              rotationLeg: 1 | 2 | null;
          }'''.replace("          ", ""),
          )
          replace_once(
              api,
              '''      grade: schoolClass.grade,
              }),'''.replace("          ", ""),
              '''      grade: schoolClass.grade,
              profile: schoolClass.profile ?? "REGULAR",
              }),'''.replace("          ", ""),
          )
          replace_once(
              api,
              '''      min_day_gap: assignment.minDayGap,
              }),'''.replace("          ", ""),
              '''      min_day_gap: assignment.minDayGap,
              parallel_key: assignment.parallelKey,
              rotation_key: assignment.rotationKey,
              rotation_leg: assignment.rotationLeg,
              }),'''.replace("          ", ""),
          )
          replace_once(
              api,
              '''        name: stringField(body, "name"),
              });'''.replace("          ", ""),
              '''        name: stringField(body, "name"),
                profile: (["REGULAR", "SPORTS", "CUSTOM"].includes(
                  stringField(body, "profile"),
                )
                  ? stringField(body, "profile")
                  : "REGULAR") as LocalClass["profile"],
              });'''.replace("          ", ""),
          )
          replace_once(
              api,
              '''        minDayGap: nullableNumber(body, "minDayGap"),
              });'''.replace("          ", ""),
              '''        minDayGap: nullableNumber(body, "minDayGap"),
                parallelKey: stringField(body, "parallelKey") || null,
                rotationKey: stringField(body, "rotationKey") || null,
                rotationLeg: ([1, 2].includes(Number(body.rotationLeg))
                  ? Number(body.rotationLeg)
                  : null) as 1 | 2 | null,
              });'''.replace("          ", ""),
          )

          PY
      - run: npx prettier --write apps/web/lib/domain/contracts.ts apps/web/lib/domain/class-groups.ts apps/web/lib/local/api.ts
      - run: ruff format apps/solver/app/main.py apps/solver/app/models.py apps/solver/app/class_groups.py
      - name: Commit core patch
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/solver/app/main.py apps/solver/app/models.py apps/solver/app/class_groups.py apps/web/lib/domain/contracts.ts apps/web/lib/domain/class-groups.ts apps/web/lib/local/api.ts
          git commit -m "feat(solver): support cross-subject group rotations"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
