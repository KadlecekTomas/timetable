name: Apply feasibility-first solver hotfix

on:
  push:
    branches:
      - agent/feasibility-first-solver

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/feasibility-first-solver

      - name: Apply targeted patch
        run: python scripts/apply-feasibility-first-solver.py

      - name: Syntax check
        run: python -m py_compile apps/solver/app/main.py apps/solver/tests/test_solve.py

      - name: Commit production patch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/solver/app/main.py apps/solver/tests/test_solve.py apps/web/app/generate/page.tsx
          git rm scripts/apply-feasibility-first-solver.py .github/workflows/apply-feasibility-first-solver.yml
          git commit -m "Make full-school solving feasibility-first"
          git push origin HEAD:agent/feasibility-first-solver
