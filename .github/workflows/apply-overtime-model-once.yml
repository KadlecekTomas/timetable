name: Apply teacher overtime model once

on:
  push:
    branches:
      - agent/teacher-overtime-load

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/teacher-overtime-load
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply overtime model
        run: python .github/scripts/apply_overtime_model.py
      - name: Format modified files
        run: npx prettier --write apps/web/lib/local/staffing-plan.ts apps/web/lib/import/staffing-workbook.ts apps/web/lib/import/legacy-staffing-plan.ts apps/web/lib/local/school-project-generation.ts apps/web/app/staffing/page.tsx apps/web/tests/manual-staffing-save.test.ts apps/web/e2e/staffing.spec.ts apps/web/e2e/actual-2027-workbook.spec.ts
      - name: Commit implementation and remove one-time files
        run: |
          rm .github/workflows/apply-overtime-model-once.yml
          rm .github/scripts/apply_overtime_model.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web .github/workflows/apply-overtime-model-once.yml .github/scripts/apply_overtime_model.py
          git commit -m "feat(staffing): model base load and overtime separately"
          git push origin HEAD:agent/teacher-overtime-load
