name: Format client workbook
on:
  push:
    branches: [feat/client-friendly-excel-template]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-friendly-excel-template
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write apps/web/lib/import/client-workbook.ts apps/web/tests/client-workbook.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/import/client-workbook.ts apps/web/tests/client-workbook.test.ts
          git commit -m "style: format client workbook implementation"
          git push origin HEAD:feat/client-friendly-excel-template
