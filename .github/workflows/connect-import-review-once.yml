name: Connect Excel import review once

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Stage valid Excel imports for review instead of saving immediately
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/teaching-plan/page.tsx")
          content = path.read_text()

          replacements = [
              (
                  'import { useSearchParams } from "next/navigation";',
                  'import { useRouter, useSearchParams } from "next/navigation";',
              ),
              (
                  'import {\n  STAFFING_SUBJECTS,\n  loadStaffingPlan,',
                  'import {\n  createPendingTeachingPlanImport,\n  savePendingTeachingPlanImport,\n} from "@/lib/local/teaching-plan-import-review";\nimport {\n  STAFFING_SUBJECTS,\n  loadStaffingPlan,',
              ),
              (
                  'export default function TeachingPlanPage() {\n  const searchParams = useSearchParams();',
                  'export default function TeachingPlanPage() {\n  const router = useRouter();\n  const searchParams = useSearchParams();',
              ),
              (
                  '    setSelectedClass(nextPlan.classes[0]?.code ?? "");\n    setLoaded(true);',
                  '    setSelectedClass(nextPlan.classes[0]?.code ?? "");\n    if (new URLSearchParams(window.location.search).get("imported") === "1") {\n      setMessage(\n        `Excel byl potvrzen a převzat do editoru. Zkontrolujte případné poslední úpravy a potom výuku uložte do projektu.`,\n      );\n    }\n    setLoaded(true);',
              ),
              (
                  '''      setAnalysis(result);
      if (!result.valid) return;
      if (
        plan.rows.length > 0 &&
        !window.confirm("Nahradit aktuální plán obsahem nahraného Excelu?")
      ) {
        return;
      }
      commit(result.plan);
      setSelectedClass(result.plan.classes[0]?.code ?? "");
      setMessage(
        `Načteno ${result.summary.classes} tříd a ${result.summary.subjects} předmětů. Teď vše zkontrolujte na kartách.`,
      );''',
                  '''      setAnalysis(result);
      if (!result.valid) return;
      savePendingTeachingPlanImport(
        createPendingTeachingPlanImport({
          fileName: file.name,
          schoolYearId,
          analysis: result,
        }),
      );
      router.push(`/teaching-plan/review?${context}`);''',
              ),
              (
                  '''            Excel obsahuje rozbalovací seznamy s učiteli z Kroku 1 a přímo
            kontroluje lichý počet dvojhodin i chybějícího druhého učitele.''',
                  '''            Excel obsahuje rozbalovací seznamy s učiteli z Kroku 1 a přímo
            kontroluje lichý počet dvojhodin i chybějícího druhého učitele. Po
            nahrání se nic nepřepíše — nejdřív projdete učitele, každou třídu,
            dotace, dělení a dvojhodiny v bezpečném kontrolním průvodci.''',
              ),
          ]

          for old, new in replacements:
              if old not in content:
                  raise SystemExit(f"Expected fragment not found:\n{old[:160]}")
              content = content.replace(old, new, 1)

          path.write_text(content)
          PY
      - run: npx prettier --write apps/web/app/teaching-plan/page.tsx apps/web/app/teaching-plan/review/page.tsx apps/web/lib/local/teaching-plan-import-review.ts
      - name: Commit staged review flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/teaching-plan/page.tsx apps/web/app/teaching-plan/review/page.tsx apps/web/lib/local/teaching-plan-import-review.ts
          git commit -m "feat(teaching-plan): require guided Excel verification"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
