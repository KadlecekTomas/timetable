name: Agent modern confirm migration

on:
  push:
    branches:
      - agent/modern-confirm-dialog

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/modern-confirm-dialog
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/migrate-confirm-dialogs.mjs
      - run: npx prettier --write apps/web/app/coverage/page.tsx apps/web/app/staffing/page.tsx apps/web/app/teaching-plan/page.tsx
      - name: Commit migrated dialogs
        run: |
          if git diff --quiet; then
            echo "No migration changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/coverage/page.tsx apps/web/app/staffing/page.tsx apps/web/app/teaching-plan/page.tsx
          git commit -m "Replace remaining browser confirms"
          git push origin HEAD:agent/modern-confirm-dialog
