name: Patch school client template download

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/client-friendly-excel-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Use the school-prefilled workbook in the download action
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/app/import/page.tsx')
          text = path.read_text()
          replacements = {
              'import { createClientImportTemplate } from "@/lib/import/client-workbook";':
                  'import { createSchoolClientImportTemplate } from "@/lib/import/school-client-workbook";',
              'const bytes = await createClientImportTemplate();':
                  'const bytes = await createSchoolClientImportTemplate();',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          npx prettier --write apps/web/app/import/page.tsx apps/web/lib/import/client-workbook-prefill.ts apps/web/lib/import/school-client-workbook.ts apps/web/tests/school-client-workbook.test.ts
      - name: Commit application changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web
          git commit -m "feat: download school-prefilled client template"
          git push origin HEAD:${{ github.head_ref }}
