name: Agent group 3 workbook gate

on:
  push:
    branches:
      - agent/fix-project-delete-and-school-groups

permissions:
  contents: write

jobs:
  workbook-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-project-delete-and-school-groups
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/agent_patch_teaching_plan_group3_workbook.py
      - run: npm install
      - name: Format and verify web
        run: |
          npx prettier --write \
            .github/workflows/agent-apply-school-group-fixes.yml \
            apps/web/lib/import/teaching-plan-workbook.ts \
            apps/web/tests/teaching-plan-workbook.test.ts
          npm run format:check
          npm run lint --workspace @timetable/web
          npm run typecheck --workspace @timetable/web
          npm run test --workspace @timetable/web
      - name: Commit tested workbook support
        shell: bash
        run: |
          rm scripts/agent_patch_teaching_plan_group3_workbook.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/import/teaching-plan-workbook.ts apps/web/tests/teaching-plan-workbook.test.ts scripts/agent_patch_teaching_plan_group3_workbook.py
          git commit -m "fix: preserve three-group English in teaching plan Excel"
          git push origin HEAD:agent/fix-project-delete-and-school-groups
