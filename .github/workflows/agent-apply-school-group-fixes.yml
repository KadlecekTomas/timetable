name: Agent school group browser gate

on:
  push:
    branches:
      - agent/fix-project-delete-and-school-groups

jobs:
  browser-gate:
    runs-on: ubuntu-latest
    env:
      SOLVER_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-project-delete-and-school-groups
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install
      - run: pip install "."
        working-directory: apps/solver
      - run: npx playwright install --with-deps chromium
      - name: Build web
        run: npm run build --workspace @timetable/web
      - name: Start solver and web
        shell: bash
        run: |
          nohup bash -c 'cd apps/solver && uvicorn app.main:app --host 127.0.0.1 --port 8000' > /tmp/solver.log 2>&1 &
          nohup npm run start --workspace @timetable/web > /tmp/web.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null && \
               curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null && \
               curl --fail --silent http://127.0.0.1:3000/solver/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/solver.log || true
          cat /tmp/web.log || true
          exit 1
      - name: Verify deletion, rotations and exact uploaded workbook
        run: npm run e2e --workspace @timetable/web -- e2e/local-first.spec.ts e2e/subject-rotation-and-sports.spec.ts e2e/exact-uploaded-excel-generation.spec.ts --retries=0
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: school-group-browser-gate-failure
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/solver.log
            /tmp/web.log
          if-no-files-found: ignore
