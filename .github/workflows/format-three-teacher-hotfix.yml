name: Format three-teacher hotfix

on:
  push:
    branches: [hotfix/three-teacher-tv]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/three-teacher-tv
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          apps/web/lib/local/teaching-plan-school-v3.ts
          apps/web/tests/actual-tv-staffing-totals.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/lib/local/teaching-plan-school-v3.ts \
            apps/web/tests/actual-tv-staffing-totals.test.ts
          git commit -m "Format three-teacher TV hotfix"
          git push origin HEAD:hotfix/three-teacher-tv
