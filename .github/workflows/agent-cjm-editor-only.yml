name: Agent finalize CJM editor integration

on:
  push:
    branches:
      - agent/fix-cjm-same-teacher-rotation

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-cjm-same-teacher-rotation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Apply editor integration
        run: python .github/scripts/cjm_editor_patch.py
      - name: Verify web
        shell: bash
        run: |
          npx prettier --write apps/web/app/teaching-plan/page.tsx apps/web/tests/mandatory-school-splits.test.ts
          npm run typecheck --workspace @timetable/web
          npm run test --workspace @timetable/web
      - name: Commit verified editor integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/teaching-plan/page.tsx apps/web/tests/mandatory-school-splits.test.ts
          git commit -m "fix: reuse generation rules in teaching editor"
          git push origin HEAD:agent/fix-cjm-same-teacher-rotation
