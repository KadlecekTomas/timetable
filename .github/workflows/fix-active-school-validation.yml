name: Fix active school validation artifact

on:
  pull_request:
    branches:
      - main

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re

          plan = Path('apps/web/lib/local/teaching-plan-school.ts')
          text = plan.read_text()
          pattern = re.compile(
              r'  for \(const \[grade, classes\] of classesByGrade\) \{\n'
              r'    const references = classes\.filter\(\(schoolClass\) =>\n'
              r'      isSchoolReferenceClass\(schoolClass\.code\),\n'
              r'    \);\n'
              r'    const sportsClasses = classes\.filter\(\(schoolClass\) =>\n'
              r'      isSchoolSportsClass\(schoolClass\.code\),\n'
              r'    \);'
          )
          replacement = '''  for (const [grade, classes] of classesByGrade) {
            const activeClasses = classes.filter(
              (schoolClass) => allocationForClass(plan.rows, schoolClass.code).size > 0,
            );
            const references = activeClasses.filter((schoolClass) =>
              isSchoolReferenceClass(schoolClass.code),
            );
            const sportsClasses = activeClasses.filter((schoolClass) =>
              isSchoolSportsClass(schoolClass.code),
            );'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'validation block replacements: {count}')
          plan.write_text(text)

          workbook = Path('apps/web/lib/import/teaching-plan-workbook-school-final.ts')
          text = workbook.read_text()
          pattern = re.compile(
              r'  const kadlecekLabel = kadlecek\n'
              r'    \? `\$\{teacherCodes\.get\(kadlecek\.id\)\} · \$\{kadlecek\.firstName\} \$\{kadlecek\.lastName\}`\n'
              r'    : "KAD · Tomáš Kadleček";'
          )
          replacement = '''  if (!kadlecek) {
            sheet.autoFilter = { from: "A5", to: "K5" };
            return;
          }
          const kadlecekLabel = `${teacherCodes.get(kadlecek.id)} · ${kadlecek.firstName} ${kadlecek.lastName}`;'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Kadlecek seed replacements: {count}')
          workbook.write_text(text)
          PY
      - run: npx prettier --write apps/web/lib/local/teaching-plan-school.ts apps/web/lib/import/teaching-plan-workbook-school-final.ts
      - uses: actions/upload-artifact@v4
        with:
          name: active-school-validation-files
          path: |
            apps/web/lib/local/teaching-plan-school.ts
            apps/web/lib/import/teaching-plan-workbook-school-final.ts
