name: Format allocation matrix

on:
  push:
    branches: [feat/subject-allocation-matrix]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/subject-allocation-matrix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write apps/web/lib/import/teaching-plan-workbook-school-entry.ts
      - run: |
          rm -f .github/workflows/format-matrix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/lib/import/teaching-plan-workbook-school-entry.ts .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "style: format subject allocation matrix"
          git push origin HEAD:feat/subject-allocation-matrix
