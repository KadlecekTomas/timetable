name: Format current school generation test once

on:
  push:
    branches:
      - test/current-school-generation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/current-school-generation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write apps/web/e2e/current-school-generation.spec.ts
      - name: Commit formatted test
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/current-school-generation.spec.ts
          git commit -m "style: format current school generation test"
          git push origin HEAD:test/current-school-generation
