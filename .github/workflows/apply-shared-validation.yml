name: Apply shared-class web validation patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: python .github/scripts/patch_shared_validation.py
      - run: npx prettier --write apps/web/lib/domain/validation.ts apps/web/lib/domain/class-groups.ts
      - run: npm run typecheck --workspace @timetable/web
      - run: npm run test --workspace @timetable/web
      - name: Commit validation support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/domain
          git commit -m "feat: validate shared classes and synchronized split groups"
          git push origin HEAD:${{ github.head_ref }}
