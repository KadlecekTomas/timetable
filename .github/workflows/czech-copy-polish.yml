name: Polish Czech interface copy

on:
  pull_request:

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Replace remaining technical wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "apps/web/app/data/page.tsx": {
                  "Vraťte se na Přehled a otevřete data s parametrem schoolYearId.":
                      "Vraťte se na Přehled a vyberte školní rok.",
                  'field("minWeeklyLoad", "Minimum", "number", false)':
                      'field("minWeeklyLoad", "Nejnižší úvazek", "number", false)',
                  'field("maxWeeklyLoad", "Maximum", "number", false)':
                      'field("maxWeeklyLoad", "Nejvyšší úvazek", "number", false)',
                  'field("maxPerDay", "Maximum za den", "number", false)':
                      'field("maxPerDay", "Nejvýše za den", "number", false)',
              },
              "apps/web/app/timetable/page.tsx": {
                  "Přesun není validní.": "Přesun není platný.",
                  "Nejprve dokončete generování návrhu.":
                      "Nejprve dokončete vytvoření návrhu.",
                  "Žádné evidované penalizace.":
                      "Žádné evidované srážky bodů.",
              },
          }

          for path, values in replacements.items():
              file = Path(path)
              text = file.read_text()
              for old, new in values.items():
                  if old not in text:
                      raise SystemExit(f"Chybí očekávaný text v {path}: {old}")
                  text = text.replace(old, new)
              file.write_text(text)
          PY
      - run: npx prettier --write apps/web/app/data/page.tsx apps/web/app/timetable/page.tsx
      - name: Audit visible development jargon
        shell: bash
        run: |
          ! grep -RInE --include='*.tsx' '(>[^<]*(Undo|Revision|FEASIBLE|OPTIMAL|INFEASIBLE|QUEUED|RUNNING|WHOLE|GROUP_1|GROUP_2|UNAVAILABLE|PREFERRED|DISCOURAGED)[^<]*<)|(readiness|immutable|solver snapshot|hard-validátor|MVP pracovní)' apps/web/app apps/web/components
      - name: Commit polished Czech copy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/data/page.tsx apps/web/app/timetable/page.tsx
          git commit -m "fix: polish remaining Czech interface copy"
          git push origin HEAD:${{ github.head_ref }}
