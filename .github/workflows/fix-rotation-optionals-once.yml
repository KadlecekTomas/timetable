name: Fix optional rotation fields once

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Normalize optional second subject values
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/teaching-plan/page.tsx")
          content = path.read_text()
          content = content.replace(
              "subjectIdByCode.get(row.secondarySubjectCode)",
              'subjectIdByCode.get(row.secondarySubjectCode ?? "")',
          ).replace(
              '''row.organization === "ROTATION"
                      ? row.secondarySubjectCode
                      : row.subjectCode,''',
              '''row.organization === "ROTATION"
                      ? (row.secondarySubjectCode ?? "")
                      : row.subjectCode,''',
          ).replace(
              '''row.organization === "ROTATION"
                      ? row.secondarySubjectCode
                      : row.subjectCode
                  }''',
              '''row.organization === "ROTATION"
                      ? (row.secondarySubjectCode ?? "")
                      : row.subjectCode
                  }''',
          )
          path.write_text(content)
          PY
      - run: npx prettier --write apps/web/app/teaching-plan/page.tsx
      - name: Commit optional-field fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/teaching-plan/page.tsx
          git commit -m "fix(teaching-plan): normalize optional rotation subjects"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
