name: Connect staffing to teaching plan once

on:
  pull_request:

permissions:
  contents: write

jobs:
  connect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Point the first step at the beginner teaching workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/staffing/page.tsx")
          content = path.read_text()
          old_href = '<Link href={`/data?section=classes&${context}`}>'
          old_label = 'Pokračovat na třídy'
          if old_href not in content or old_label not in content:
              raise SystemExit("Old staffing continuation link was not found")
          content = content.replace(
              old_href,
              '<Link href={`/teaching-plan?${context}`}>',
              1,
          ).replace(old_label, 'Pokračovat na výuku tříd', 1)
          path.write_text(content)
          PY
      - run: npx prettier --write apps/web/app/staffing/page.tsx
      - name: Commit navigation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/staffing/page.tsx
          git commit -m "fix(staffing): continue directly to class teaching"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
