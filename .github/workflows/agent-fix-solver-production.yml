name: Apply production solver diagnostics

on:
  push:
    branches: [agent/leadership-ux-gate]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/leadership-ux-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Patch local generation errors and UI
        run: |
          python - <<'PY'
          from pathlib import Path

          api_path = Path("apps/web/lib/local/api.ts")
          api = api_path.read_text(encoding="utf-8")

          if "type SolverPayload =" not in api:
              marker = "\n\nasync function createGenerationRun("
              position = api.index(marker, api.index("function solverEndpoint"))
              helper = '''

          type SolverPayload = SolverResponse & {
            detail?: unknown;
            error?: {
              code?: string;
              message?: string;
              details?: Record<string, unknown>;
            };
          };

          async function readSolverPayload(response: Response): Promise<SolverPayload> {
            const responseText = await response.text();
            if (!responseText) {
              return {
                status: "FAILED",
                objective_value: 0,
                lessons: [],
                detail: null,
              };
            }
            try {
              return JSON.parse(responseText) as SolverPayload;
            } catch {
              return {
                status: "FAILED",
                objective_value: 0,
                lessons: [],
                detail: responseText,
              };
            }
          }
          '''
              api = api[:position] + helper + api[position:]

          old_parser = '''    const solverPayload = (await solverResponse.json()) as SolverResponse & {
            detail?: unknown;
          };
          '''
          new_parser = "    const solverPayload = await readSolverPayload(solverResponse);\n"
          if old_parser in api:
              api = api.replace(old_parser, new_parser, 1)
          elif new_parser not in api:
              raise SystemExit("solver response parser not found")

          old_failure = '''    if (!solverResponse.ok) {
            await mutateProject((next) => {
              const run = next.generationRuns.find((item) => item.id === runId);
              if (!run) return;
              run.status = solverResponse.status === 422 ? "INFEASIBLE" : "FAILED";
              run.explanation = solverPayload.detail ?? solverPayload;
              run.finishedAt = now();
            });
            return jsonResponse(
              { generationRunId: runId, status: "QUEUED", inputSnapshotHash },
              202,
            );
          }
          '''
          new_failure = '''    if (!solverResponse.ok) {
            const explanation =
              solverPayload.detail ?? solverPayload.error ?? solverPayload;
            const failureMessage =
              solverPayload.error?.message ??
              (solverResponse.status === 422
                ? "Plánovací modul nenašel proveditelný rozvrh."
                : "Výpočet se nepodařilo spustit.");
            await mutateProject((next) => {
              const run = next.generationRuns.find((item) => item.id === runId);
              if (!run) return;
              run.status = solverResponse.status === 422 ? "INFEASIBLE" : "FAILED";
              run.explanation = explanation;
              run.finishedAt = now();
            });
            return errorResponse(
              solverResponse.status,
              solverPayload.error?.code ??
                (solverResponse.status === 422
                  ? "TIMETABLE_INFEASIBLE"
                  : "SOLVER_REQUEST_FAILED"),
              failureMessage,
              { generationRunId: runId, explanation },
            );
          }
          '''
          if old_failure in api:
              api = api.replace(old_failure, new_failure, 1)
          elif "const failureMessage =" not in api:
              raise SystemExit("solver failure block not found")

          old_catch = '''  } catch (error) {
            await mutateProject((next) => {
              const run = next.generationRuns.find((item) => item.id === runId);
              if (!run) return;
              run.status = "FAILED";
              run.explanation = {
                message:
                  error instanceof Error ? error.message : "Neznámá chyba výpočtu.",
              };
              run.finishedAt = now();
            });
          }

          return jsonResponse(
          '''
          new_catch = '''  } catch (error) {
            const timedOut = error instanceof Error && error.name === "TimeoutError";
            const networkFailure = error instanceof TypeError;
            const message = timedOut
              ? "Výpočet překročil časový limit. Zvolte delší limit a spusťte jej znovu."
              : networkFailure
                ? "Plánovací modul je dočasně nedostupný. Výpočet nebyl zahájen."
                : error instanceof Error
                  ? error.message
                  : "Neznámá chyba výpočtu.";
            await mutateProject((next) => {
              const run = next.generationRuns.find((item) => item.id === runId);
              if (!run) return;
              run.status = "FAILED";
              run.explanation = { message };
              run.finishedAt = now();
            });
            return errorResponse(
              timedOut ? 504 : 502,
              timedOut ? "SOLVER_TIMEOUT" : "GENERATION_FAILED",
              message,
              { generationRunId: runId },
            );
          }

          return jsonResponse(
          '''
          if old_catch in api:
              api = api.replace(old_catch, new_catch, 1)
          elif "const timedOut =" not in api:
              raise SystemExit("solver catch block not found")

          api_path.write_text(api, encoding="utf-8")

          page_path = Path("apps/web/app/generate/page.tsx")
          page = page_path.read_text(encoding="utf-8")
          import_line = 'import { generationFailureMessage } from "@/lib/generation-errors";\n'
          if import_line not in page:
              anchor = 'import type { ReadinessReport } from "@/lib/domain/contracts";\n'
              page = page.replace(anchor, anchor + import_line, 1)

          old_created = '''                    <p className="mt-1 text-xs text-text-muted">
                                Vytvořeno{" "}
                                {new Date(run.createdAt).toLocaleString("cs-CZ")}
                              </p>
          '''
          new_created = '''                    <p className="mt-1 text-xs text-text-muted">
                                Vytvořeno{" "}
                                {new Date(run.createdAt).toLocaleString("cs-CZ")}
                              </p>
                              {["FAILED", "INFEASIBLE"].includes(run.status) ? (
                                <p className="mt-1 max-w-xl text-xs text-danger-strong">
                                  {generationFailureMessage(run.explanation) ??
                                    "Výpočet skončil bez výsledku. Zkuste jej spustit znovu."}
                                </p>
                              ) : null}
          '''
          if old_created in page:
              page = page.replace(old_created, new_created, 1)
          elif "generationFailureMessage(run.explanation)" not in page:
              raise SystemExit("generation timestamp block not found")

          page_path.write_text(page, encoding="utf-8")
          PY
      - run: npx prettier --write apps/web/lib/local/api.ts apps/web/app/generate/page.tsx
      - name: Commit patched files
        run: |
          if git diff --quiet -- apps/web/lib/local/api.ts apps/web/app/generate/page.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/local/api.ts apps/web/app/generate/page.tsx
          git commit -m "fix(ui): expose solver failures immediately"
          git push origin HEAD:agent/leadership-ux-gate
