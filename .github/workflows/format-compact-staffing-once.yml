name: Format compact staffing workbook once

on:
  push:
    branches:
      - feat/compact-vertical-staffing-excel

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compact-vertical-staffing-excel
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write apps/web/lib/import/staffing-workbook-school.ts
      - run: |
          rm -f .github/workflows/format-compact-staffing-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/lib/import/staffing-workbook-school.ts .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "chore: format compact staffing workbook"
          git push origin HEAD:feat/compact-vertical-staffing-excel
