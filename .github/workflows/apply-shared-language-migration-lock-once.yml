name: Apply shared language migration lock once

on:
  push:
    branches:
      - fix/shared-second-language-no-grade7-electives

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shared-second-language-no-grade7-electives
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/patch-shared-language-migration-lock.py
      - run: npm install
      - run: npx prettier --write apps/web/lib/local/teaching-plan-school-v3.ts
      - run: npm run typecheck --workspace @timetable/web
      - run: npm run test --workspace @timetable/web
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/local/teaching-plan-school-v3.ts
          git commit -m "fix: prevent recursive teaching-plan migration"
          git push origin HEAD:fix/shared-second-language-no-grade7-electives
