name: Format Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show exact Prettier diff
        shell: bash
        run: |
          npx prettier --write apps/web/e2e/school-scheduling-policy.spec.ts apps/web/tests/school-scheduling-preferences-generation.test.ts
          git diff -- apps/web/e2e/school-scheduling-policy.spec.ts apps/web/tests/school-scheduling-preferences-generation.test.ts
          git diff --quiet -- apps/web/e2e/school-scheduling-policy.spec.ts apps/web/tests/school-scheduling-preferences-generation.test.ts
