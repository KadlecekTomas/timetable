name: Exact uploaded Excel solver gate

on:
  push:
    branches:
      - agent/fix-real-excel-generation

jobs:
  exact-excel-solver:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SOLVER_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-real-excel-generation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm install
      - run: pip install "."
        working-directory: apps/solver
      - run: npx playwright install --with-deps chromium
      - name: Build web
        run: npm run build --workspace @timetable/web
      - name: Start solver and web
        shell: bash
        run: |
          nohup bash -c 'cd apps/solver && uvicorn app.main:app --host 127.0.0.1 --port 8000' > /tmp/solver.log 2>&1 &
          nohup npm run start --workspace @timetable/web > /tmp/web.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null && \
               curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null && \
               curl --fail --silent http://127.0.0.1:3000/solver/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/solver.log || true
          cat /tmp/web.log || true
          exit 1
      - name: Generate timetable from exact anonymized uploaded Excel
        run: npm run e2e --workspace @timetable/web -- e2e/exact-uploaded-excel-generation.spec.ts --retries=0
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: exact-uploaded-excel-solver-failure
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/solver.log
            /tmp/web.log
          if-no-files-found: ignore
