name: Preserve imported class set

on:
  push:
    branches:
      - feat/combined-school-excel

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/combined-school-excel
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/lib/local/teaching-plan-school.ts')
          text = path.read_text()
          old = '''function ensureSchoolClasses(classes: TeachingPlanClass[]): TeachingPlanClass[] {
            const byCode = new Map(
              classes.map((schoolClass) => [
                base.normalizeClassCode(schoolClass.code),
                enforceClassProfile(schoolClass),
              ]),
            );

            return SCHOOL_CLASS_CODES.map((code) => {
              const existing = byCode.get(code);
              return existing ?? createTeachingPlanClass(code);
            });
          }
          '''
          new = '''function ensureSchoolClasses(classes: TeachingPlanClass[]): TeachingPlanClass[] {
            const byCode = new Map<string, TeachingPlanClass>();
            for (const schoolClass of classes) {
              const code = base.normalizeClassCode(schoolClass.code);
              if (!code || byCode.has(code)) continue;
              byCode.set(
                code,
                enforceClassProfile({
                  ...schoolClass,
                  code,
                }),
              );
            }
            return [...byCode.values()];
          }
          '''
          if old not in text:
              raise SystemExit('ensureSchoolClasses block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write apps/web/lib/local/teaching-plan-school.ts
          rm -f .github/workflows/preserve-imported-classes.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/lib/local/teaching-plan-school.ts .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve imported class set"
          git push origin HEAD:feat/combined-school-excel
