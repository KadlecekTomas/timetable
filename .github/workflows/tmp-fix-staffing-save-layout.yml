name: Temporary staffing save layout fix

on:
  push:
    branches:
      - agent/fix-staffing-save-button-layout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-staffing-save-button-layout
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Patch staffing card header layout and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path('apps/web/app/staffing/page.tsx')
          text = page_path.read_text()
          old_header = '''              <div className="flex flex-wrap items-start justify-between gap-4 border-b border-border bg-surface-subtle px-5 py-4">
                <div className="flex items-center gap-3">
                  <div className="flex size-10 items-center justify-center rounded-full bg-primary-subtle font-semibold text-primary">
                    {originalIndex + 1}
                  </div>
                  <div>
                    <h3 className="font-semibold text-text-primary">{label}</h3>'''
          new_header = '''              <div className="grid gap-4 border-b border-border bg-surface-subtle px-5 py-4 lg:grid-cols-[minmax(0,1fr)_400px] lg:items-center">
                <div className="flex min-w-0 items-center gap-3">
                  <div className="flex size-10 shrink-0 items-center justify-center rounded-full bg-primary-subtle font-semibold text-primary">
                    {originalIndex + 1}
                  </div>
                  <div className="min-w-0">
                    <h3 className="truncate font-semibold text-text-primary" title={label}>
                      {label}
                    </h3>'''
          if old_header not in text:
              raise SystemExit('teacher header source snippet not found')
          text = text.replace(old_header, new_header, 1)

          old_actions = '''                <div className="flex flex-wrap items-center justify-end gap-2">'''
          new_actions = '''                <div className="flex flex-wrap items-center justify-end gap-2 lg:grid lg:w-[400px] lg:grid-cols-[max-content_max-content_112px_40px] lg:flex-none lg:justify-end">'''
          if old_actions not in text:
              raise SystemExit('teacher action group snippet not found')
          text = text.replace(old_actions, new_actions, 1)

          old_button = '''                    disabled={!dirty}
                    aria-label={`Uložit ${label}`}
                  >'''
          new_button = '''                    disabled={!dirty}
                    aria-label={`Uložit ${label}`}
                    className="w-28 justify-center"
                  >'''
          if old_button not in text:
              raise SystemExit('save button snippet not found')
          text = text.replace(old_button, new_button, 1)

          old_delete = '''                    className="rounded-md p-2 text-text-muted hover:bg-danger-subtle hover:text-danger focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"'''
          new_delete = '''                    className="flex size-10 shrink-0 items-center justify-center rounded-md text-text-muted hover:bg-danger-subtle hover:text-danger focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"'''
          if old_delete not in text:
              raise SystemExit('delete button snippet not found')
          text = text.replace(old_delete, new_delete, 1)
          page_path.write_text(text)

          spec_path = Path('apps/web/e2e/staffing.spec.ts')
          spec = spec_path.read_text()
          marker = '''test("teacher with three overtime hours can be completed and saved", async ({
  page,
}) => {'''
          regression = r'''test("save action stays fixed for long teacher labels and saved state", async ({
  page,
}) => {
  await page.setViewportSize({ width: 1440, height: 900 });
  await page.goto("/staffing?schoolYearId=local-school-year");
  await page.getByRole("button", { name: "Přidat učitele ručně" }).click();

  await page
    .getByLabel("Jméno")
    .fill("Alexandra-Konstantina-Magdaléna-Mimořádně-Dlouhé-Jméno");
  await page
    .getByLabel("Příjmení")
    .fill("NejdelšíPříjmeníKteréNesmíRozbítHlavičkuKartyUčitele");

  const card = page.locator('[data-testid^="teacher-card-"]').first();
  const save = card.getByRole("button", { name: /^Uložit / });
  const longDirtyBox = await save.boundingBox();
  expect(longDirtyBox).not.toBeNull();

  await save.click();
  await expect(save).toContainText("Uloženo");
  const longSavedBox = await save.boundingBox();
  expect(longSavedBox).not.toBeNull();

  await page.getByLabel("Jméno").fill("A");
  await page.getByLabel("Příjmení").fill("B");
  await expect(save).toContainText("Uložit");
  const shortDirtyBox = await save.boundingBox();
  expect(shortDirtyBox).not.toBeNull();

  for (const box of [longSavedBox!, shortDirtyBox!]) {
    expect(Math.abs(box.x - longDirtyBox!.x)).toBeLessThan(1);
    expect(Math.abs(box.y - longDirtyBox!.y)).toBeLessThan(1);
    expect(Math.abs(box.width - longDirtyBox!.width)).toBeLessThan(1);
  }
});

'''
          if marker not in spec:
              raise SystemExit('staffing e2e insertion marker not found')
          if 'save action stays fixed for long teacher labels and saved state' not in spec:
              spec = spec.replace(marker, regression + marker, 1)
          spec_path.write_text(spec)
          PY

      - run: npx prettier --write apps/web/app/staffing/page.tsx apps/web/e2e/staffing.spec.ts
      - run: npm run lint --workspace @timetable/web
      - run: npm run typecheck --workspace @timetable/web
      - run: npm run test --workspace @timetable/web

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/staffing/page.tsx apps/web/e2e/staffing.spec.ts
          git commit -m "fix: keep staffing save actions aligned"
          git push origin HEAD:agent/fix-staffing-save-button-layout
