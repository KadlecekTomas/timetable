name: Apply rotation compatibility once

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Make new fields backward compatible
        run: |
          python - <<'PY'
          from pathlib import Path

          teaching = Path("apps/web/lib/local/teaching-plan.ts")
          content = teaching.read_text()
          content = content.replace(
              "  profile: TeachingClassProfile;",
              "  profile?: TeachingClassProfile;",
              1,
          ).replace(
              "  secondarySubjectCode: string;",
              "  secondarySubjectCode?: string;",
              1,
          )
          teaching.write_text(content)

          workbook = Path("apps/web/lib/import/teaching-plan-workbook.ts")
          content = workbook.read_text()
          old = '''const ORGANIZATION_LABELS: Record<TeachingOrganization, string> = {
            WHOLE: "Celá třída",
            SPLIT: "Dvě skupiny",
          };'''.replace("          ", "")
          new = '''const ORGANIZATION_LABELS: Record<TeachingOrganization, string> = {
            WHOLE: "Celá třída",
            SPLIT: "Dvě skupiny",
            ROTATION: "Výměna dvou předmětů",
          };'''.replace("          ", "")
          if old not in content:
              raise SystemExit("Organization labels block not found")
          workbook.write_text(content.replace(old, new, 1))
          PY
      - run: npx prettier --write apps/web/lib/local/teaching-plan.ts apps/web/lib/import/teaching-plan-workbook.ts
      - name: Commit compatibility migration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/local/teaching-plan.ts apps/web/lib/import/teaching-plan-workbook.ts
          git commit -m "fix(teaching-plan): migrate older plans into rotation model"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
