name: Integrate realistic school contracts

on:
  push:
    branches: [feat/client-friendly-excel-template]
    paths:
      - .github/workflows/integrate-realistic-school.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-friendly-excel-template
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm install
      - name: Apply shared-class import and storage contracts
        shell: bash
        run: |
          if ! grep -q 'CLIENT_IMPORT_TEMPLATE_VERSION = "2.1.0"' apps/web/lib/import/client-workbook.ts; then
            python .github/scripts/patch_shared_import.py
          fi
          if ! grep -q 'additionalClassIds: string\[\];' apps/web/lib/local/api.ts; then
            python .github/scripts/patch_shared_local.py
          fi
          if ! grep -q '9A-9C-TV-KAD' apps/web/e2e/school-scale.spec.ts; then
            python .github/scripts/patch_school_scale_shared.py
          fi
          python .github/scripts/patch_school_template_shared.py
      - name: Format integrated files
        run: |
          npx prettier --write \
            apps/web/app/timetable/page.tsx \
            apps/web/e2e/school-scale.spec.ts \
            apps/web/lib/import/client-workbook-prefill.ts \
            apps/web/lib/import/client-workbook.ts \
            apps/web/lib/import/school-staffing-overrides.ts \
            apps/web/lib/import/workbook.ts \
            apps/web/lib/local/api.ts \
            apps/web/tests/school-client-workbook.test.ts
      - name: Validate integrated web application
        run: |
          npm run typecheck --workspace @timetable/web
          npm run test --workspace @timetable/web
      - name: Commit integrated contract and retire patchers
        shell: bash
        run: |
          rm -f \
            .github/scripts/patch_shared_solver.py \
            .github/scripts/patch_shared_validation.py \
            .github/scripts/patch_shared_import.py \
            .github/scripts/patch_shared_local.py \
            .github/scripts/patch_school_scale_shared.py \
            .github/scripts/patch_school_template_shared.py \
            .github/workflows/apply-shared-solver.yml \
            .github/workflows/apply-shared-validation.yml

          cat > .github/workflows/integrate-realistic-school.yml <<'EOF'
          name: Disabled realistic school contract integrator

          on:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            disabled:
              runs-on: ubuntu-latest
              steps:
                - run: echo "One-shot realistic school integration already completed."
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: integrate realistic 40-teacher school gate"
          git push origin HEAD:feat/client-friendly-excel-template
