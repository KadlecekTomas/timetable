name: Apply PE external capacity patch

on:
  push:
    branches: [agent/pe-external-capacity]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pe-external-capacity
      - name: Apply patch
        run: python .github/scripts/apply-pe-external-capacity.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/app/data/page.tsx apps/web/lib/local/api-school.ts apps/web/lib/local/project-share.ts apps/web/lib/local/school-project-generation.ts apps/web/lib/local/physical-education-external-occupancy.ts apps/web/tests/school-pe-facilities.test.ts apps/solver/tests/test_school_pe_facilities.py
      - name: Commit applied patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/data/page.tsx \
            apps/web/lib/local/api-school.ts \
            apps/web/lib/local/project-share.ts \
            apps/web/lib/local/school-project-generation.ts \
            apps/web/lib/local/physical-education-external-occupancy.ts \
            apps/web/tests/school-pe-facilities.test.ts \
            apps/solver/tests/test_school_pe_facilities.py
          git commit -m "Add configurable external PE capacity"
          git push origin HEAD:agent/pe-external-capacity
