name: Format overtime workbook test once

on:
  push:
    branches:
      - agent/teacher-overtime-load

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/teacher-overtime-load
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Format test
        run: npx prettier --write apps/web/tests/exceljs-empty-drawing-parts.test.ts
      - name: Commit formatted test and remove one-time workflow
        run: |
          rm .github/workflows/format-overtime-test-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/exceljs-empty-drawing-parts.test.ts .github/workflows/format-overtime-test-once.yml
          git commit -m "style: format overtime workbook regression"
          git push origin HEAD:agent/teacher-overtime-load
