name: Fix overtime E2E selectors once

on:
  push:
    branches:
      - agent/teacher-overtime-load

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/teacher-overtime-load
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Use exact label matching for base load
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('apps/web/e2e').glob('*.spec.ts'):
              text = path.read_text()
              updated = text.replace(
                  '.getByLabel("Úvazek týdně")',
                  '.getByLabel("Úvazek týdně", { exact: true })',
              )
              if updated != text:
                  path.write_text(updated)
          PY
          npx prettier --write apps/web/e2e
      - name: Commit selector fixes and remove one-time workflow
        run: |
          rm .github/workflows/fix-overtime-e2e-selectors-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e .github/workflows/fix-overtime-e2e-selectors-once.yml
          git commit -m "test: match base workload input exactly"
          git push origin HEAD:agent/teacher-overtime-load
