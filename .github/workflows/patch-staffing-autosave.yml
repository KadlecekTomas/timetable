name: Patch staffing autosave UX

on:
  push:
    branches:
      - fix/solver-ready-school-workflow

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/solver-ready-school-workflow
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply autosave patch
        run: python .github/scripts/patch-staffing-autosave.py
      - name: Format changed files
        run: npx prettier --write apps/web/app/staffing/page.tsx apps/web/e2e/staffing.spec.ts
      - name: Install dependencies
        run: npm install
      - name: Run typecheck
        run: npm run typecheck --workspace @timetable/web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run staffing browser tests
        run: npx playwright test e2e/staffing.spec.ts
        working-directory: apps/web
      - name: Commit autosave patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/staffing/page.tsx apps/web/e2e/staffing.spec.ts
          git commit -m "feat(staffing): make autosave explicit and persistent"
          git push origin HEAD:fix/solver-ready-school-workflow
