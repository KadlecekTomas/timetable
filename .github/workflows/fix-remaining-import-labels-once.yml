name: Fix remaining import labels once

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-labels:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Replace the old import navigation label in every E2E scenario
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in sorted(Path("apps/web/e2e").glob("*.spec.ts")):
              content = path.read_text()
              updated = content.replace(
                  'name: "Načtení dat"',
                  'name: "Pokročilý import"',
              )
              if updated != content:
                  path.write_text(updated)
                  changed.append(str(path))

          if not changed:
              raise SystemExit("No remaining old import labels found")
          print("Updated:", *changed, sep="\n- ")
          PY
      - run: npx prettier --write apps/web/e2e
      - name: Commit corrected scenarios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e
          git commit -m "test(import): use the advanced import navigation label"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
