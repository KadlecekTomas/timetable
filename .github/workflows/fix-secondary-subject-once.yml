name: Fix optional secondary subject once

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Coalesce the optional second subject in teacher selectors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/teaching-plan/page.tsx")
          content = path.read_text()
          old = '''? row.secondarySubjectCode
                    : row.subjectCode'''
          new = '''? (row.secondarySubjectCode ?? "")
                    : row.subjectCode'''
          count = content.count(old)
          if count != 2:
              raise SystemExit(f"Expected two optional second-subject selectors, found {count}")
          path.write_text(content.replace(old, new))
          PY
      - run: npx prettier --write apps/web/app/teaching-plan/page.tsx
      - name: Commit final type fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/teaching-plan/page.tsx
          git commit -m "fix(rotations): coalesce optional second subject"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
