name: Apply shared-class solver patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python .github/scripts/patch_shared_solver.py
      - run: pip install ".[dev]"
        working-directory: apps/solver
      - run: ruff format apps/solver
      - run: ruff check apps/solver
      - run: pytest apps/solver
      - name: Commit solver support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/solver
          git commit -m "feat: enforce shared classes and synchronized split groups"
          git push origin HEAD:${{ github.head_ref }}
