name: Agent fix real Excel generation

on:
  push:
    branches:
      - agent/fix-real-excel-generation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-real-excel-generation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Apply real Excel generation patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          helper_source = Path('.github/scripts/fix_real_excel_generation.py').read_text()
          marker = "'''    const teacherWeeklyPeriods ="
          marker_pos = helper_source.index(marker)
          expected_start = marker_pos + 3
          expected_end = helper_source.index("'''", expected_start)
          expected = helper_source[expected_start:expected_end]

          target = Path('apps/web/lib/import/legacy-staffing-plan.ts')
          text = target.read_text()
          pattern = re.compile(
              r'''    const teacherWeeklyPeriods =\s*requirement\.weeklyPeriods \+ requirement\.teacherExtraPeriods;\s*for \(const teacher of resolved\) \{\s*addSubjectHours\(teacher, requirement\.subject\.code, teacherWeeklyPeriods\);\s*\}''',
              re.S,
          )
          text, count = pattern.subn(lambda _m: expected, text, count=1)
          if count != 1:
              raise SystemExit('Could not normalize legacy teacher-hours block')
          target.write_text(text)
          PY
          python .github/scripts/fix_real_excel_generation.py
          python <<'PY'
          from pathlib import Path

          bridge = Path('apps/web/lib/local/teaching-plan-from-allocation-draft.ts')
          text = bridge.read_text()
          text = text.replace('.join("\n");', '.join("\\n");')
          authority = '''const AUTHORITATIVE_SCHOOL_CLASS_CODES = [
            "6.A",
            "6.B",
            "6.C",
            "6.D",
            "7.A",
            "7.B",
            "7.C",
            "8.A",
            "8.B",
            "8.C",
            "9.A",
            "9.B",
            "9.C",
          ] as const;

          export function isAuthoritativeAllocationDraft(
            draft: StaffingAllocationDraft | null,
          ): boolean {
            if (!draft?.rows.length) return false;
            const classCodes = new Set(draft.rows.map((row) => row.classCode));
            return AUTHORITATIVE_SCHOOL_CLASS_CODES.every((code) => classCodes.has(code));
          }

          '''
          anchor = 'function sortedClassCodes(draft: StaffingAllocationDraft): string[] {'
          if authority not in text:
              if anchor not in text:
                  raise SystemExit('bridge authority anchor missing')
              text = text.replace(anchor, authority + anchor, 1)
          bridge.write_text(text)

          v2 = Path('apps/web/lib/local/teaching-plan-school-v2.ts')
          text = v2.read_text()
          old_import = '''import {
            allocationDraftFingerprint,
            createTeachingPlanFromAllocationDraft,
          } from "./teaching-plan-from-allocation-draft";'''
          new_import = '''import {
            allocationDraftFingerprint,
            createTeachingPlanFromAllocationDraft,
            isAuthoritativeAllocationDraft,
          } from "./teaching-plan-from-allocation-draft";'''
          if old_import not in text:
              raise SystemExit('v2 bridge import not found')
          text = text.replace(old_import, new_import, 1)
          text = text.replace(
              '  if (allocationDraft?.rows.length) {',
              '  if (isAuthoritativeAllocationDraft(allocationDraft)) {',
              1,
          )
          old_fingerprint = '  const draftFingerprint = allocationDraftFingerprint(allocationDraft);'
          new_fingerprint = '''  const authoritativeDraft = isAuthoritativeAllocationDraft(allocationDraft);
            const draftFingerprint = authoritativeDraft
              ? allocationDraftFingerprint(allocationDraft)
              : "";'''
          if old_fingerprint not in text:
              raise SystemExit('v2 draft fingerprint not found')
          text = text.replace(old_fingerprint, new_fingerprint, 1)
          old_validation = '''  const curriculum =
            isCurrentSchoolPlan(plan) && !allocationDraft?.rows.length
              ? enforceCurrentSchoolCurriculumRules(
                  loadSchoolCurriculum() ?? createDefaultSchoolCurriculum(),
                )
              : null;
          return [
            ...school
              .validateTeachingPlan(plan, staffingPlan)
              .filter((message) => !isObsoleteEqualProfileMessage(message)),'''
          new_validation = '''  const authoritativeDraft = isAuthoritativeAllocationDraft(allocationDraft);
            const curriculum =
              isCurrentSchoolPlan(plan) && !authoritativeDraft
                ? enforceCurrentSchoolCurriculumRules(
                    loadSchoolCurriculum() ?? createDefaultSchoolCurriculum(),
                  )
                : null;
            return [
              ...school.validateTeachingPlan(plan, staffingPlan).filter((message) => {
                if (isObsoleteEqualProfileMessage(message)) return false;
                if (
                  authoritativeDraft &&
                  message.includes("referenční třídy") &&
                  message.includes("nemají stejnou hodinovou dotaci")
                ) {
                  return false;
                }
                return true;
              }),'''
          if old_validation not in text:
              raise SystemExit('v2 authoritative validation block not found')
          text = text.replace(old_validation, new_validation, 1)
          v2.write_text(text)

          path = Path('apps/web/lib/local/teaching-plan-school-v3.ts')
          text = path.read_text()
          old = '''export function validateTeachingPlan(
            plan: TeachingPlan,
            staffingPlan: StaffingPlan,
          ): string[] {
            const enforced = enforceCurrentSchoolTeachingStructure(plan);
            const sameTeacherPrefixes = enforced.rows
              .filter(isSameTeacherPartialSplit)
              .map((row) => `${row.classCode} ${row.subjectCode}:`);
            return base.validateTeachingPlan(enforced, staffingPlan).filter((message) => {
          '''
          new = '''export function validateTeachingPlan(
            plan: TeachingPlan,
            staffingPlan: StaffingPlan,
            allocationDraft: StaffingAllocationDraft | null | undefined = undefined,
          ): string[] {
            const enforced = enforceCurrentSchoolTeachingStructure(plan);
            const sameTeacherPrefixes = enforced.rows
              .filter(isSameTeacherPartialSplit)
              .map((row) => `${row.classCode} ${row.subjectCode}:`);
            const baseMessages =
              allocationDraft === undefined
                ? base.validateTeachingPlan(enforced, staffingPlan)
                : base.validateTeachingPlan(enforced, staffingPlan, allocationDraft);
            return baseMessages.filter((message) => {
          '''
          if old not in text:
              raise SystemExit('v3 validateTeachingPlan block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format and verify
        shell: bash
        run: |
          npx prettier --write apps/web/lib/local/staffing-allocation-draft.ts apps/web/lib/import/legacy-staffing-plan.ts apps/web/lib/local/teaching-plan-from-allocation-draft.ts apps/web/lib/local/teaching-plan-school-v2.ts apps/web/lib/local/teaching-plan-school-v3.ts apps/web/tests/real-legacy-excel-generation.test.ts
          npm run typecheck --workspace @timetable/web
          npm run test --workspace @timetable/web
      - name: Commit verified source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib apps/web/tests
          git commit -m "fix: make legacy Excel generation-ready"
          git push origin HEAD:agent/fix-real-excel-generation
