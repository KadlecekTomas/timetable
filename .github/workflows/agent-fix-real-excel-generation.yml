name: Agent fix real Excel generation

on:
  push:
    branches:
      - agent/fix-real-excel-generation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-real-excel-generation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Apply real Excel generation patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          helper = Path('.github/scripts/fix_real_excel_generation.py')
          source = helper.read_text()
          old = '''def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Missing expected block in {path}: {old[:180]!r}")
              p.write_text(text.replace(old, new, 1))
          '''
          new = '''def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  return
              parts = re.split(r"(\\s+)", old)
              pattern = "".join(r"\\s+" if part.isspace() else re.escape(part) for part in parts if part)
              updated, count = re.subn(pattern, lambda _m: new, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Missing expected block in {path}: {old[:180]!r}")
              p.write_text(updated)
          '''
          if old not in source:
              raise SystemExit('replace helper definition not found')
          exec(compile(source.replace(old, new, 1), '<real-excel-patch>', 'exec'))
          PY
          python <<'PY'
          from pathlib import Path

          path = Path('apps/web/lib/local/teaching-plan-school-v3.ts')
          text = path.read_text()
          old = '''export function validateTeachingPlan(
            plan: TeachingPlan,
            staffingPlan: StaffingPlan,
          ): string[] {
            const enforced = enforceCurrentSchoolTeachingStructure(plan);
            const sameTeacherPrefixes = enforced.rows
              .filter(isSameTeacherPartialSplit)
              .map((row) => `${row.classCode} ${row.subjectCode}:`);
            return base.validateTeachingPlan(enforced, staffingPlan).filter((message) => {
          '''
          new = '''export function validateTeachingPlan(
            plan: TeachingPlan,
            staffingPlan: StaffingPlan,
            allocationDraft: StaffingAllocationDraft | null | undefined = undefined,
          ): string[] {
            const enforced = enforceCurrentSchoolTeachingStructure(plan);
            const sameTeacherPrefixes = enforced.rows
              .filter(isSameTeacherPartialSplit)
              .map((row) => `${row.classCode} ${row.subjectCode}:`);
            const baseMessages =
              allocationDraft === undefined
                ? base.validateTeachingPlan(enforced, staffingPlan)
                : base.validateTeachingPlan(enforced, staffingPlan, allocationDraft);
            return baseMessages.filter((message) => {
          '''
          if old not in text:
              raise SystemExit('v3 validateTeachingPlan block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format and verify
        shell: bash
        run: |
          npx prettier --write apps/web/lib/local/staffing-allocation-draft.ts apps/web/lib/import/legacy-staffing-plan.ts apps/web/lib/local/teaching-plan-from-allocation-draft.ts apps/web/lib/local/teaching-plan-school-v2.ts apps/web/lib/local/teaching-plan-school-v3.ts apps/web/tests/real-legacy-excel-generation.test.ts
          npm run typecheck --workspace @timetable/web
          npm run test --workspace @timetable/web
      - name: Commit verified source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib apps/web/tests
          git commit -m "fix: make legacy Excel generation-ready"
          git push origin HEAD:agent/fix-real-excel-generation
