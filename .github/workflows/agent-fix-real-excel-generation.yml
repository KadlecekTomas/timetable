name: Agent fix real Excel generation

on:
  push:
    branches:
      - agent/fix-real-excel-generation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-real-excel-generation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Apply real Excel generation patch
        run: python .github/scripts/fix_real_excel_generation.py
      - name: Format and verify
        shell: bash
        run: |
          npx prettier --write apps/web/lib/local/staffing-allocation-draft.ts apps/web/lib/import/legacy-staffing-plan.ts apps/web/lib/local/teaching-plan-from-allocation-draft.ts apps/web/lib/local/teaching-plan-school-v2.ts apps/web/tests/real-legacy-excel-generation.test.ts
          npm run typecheck --workspace @timetable/web
          npm run test --workspace @timetable/web
      - name: Commit verified source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib apps/web/tests
          git commit -m "fix: make legacy Excel generation-ready"
          git push origin HEAD:agent/fix-real-excel-generation
