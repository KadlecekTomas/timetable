name: Patch local-first shared-class column

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: python .github/scripts/patch_local_first_shared_column.py
      - run: npx prettier --write apps/web/e2e/local-first.spec.ts
      - name: Commit updated local-first workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/local-first.spec.ts
          git commit -m "fix: align local-first workbook with shared-class column"
          git push origin HEAD:${{ github.head_ref }}
