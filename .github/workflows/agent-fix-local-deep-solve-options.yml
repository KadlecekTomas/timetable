name: Apply local Deep Solve quick options

on:
  push:
    branches:
      - agent/local-deep-solve-school-pe-defaults

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-deep-solve-school-pe-defaults
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keep quick local checks alongside 30-minute Deep Solve
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/generate/page.tsx')
          text = path.read_text()
          old = '''              <>
                <option value={300}>5 minut · rychlý lokální pokus</option>
                <option value={600}>10 minut · důkladnější hledání</option>
                <option value={1200}>20 minut · Deep Solve</option>
                <option value={LOCAL_DEEP_SOLVE_SECONDS}>
                  30 minut · Deep Solve · doporučeno
                </option>
              </>'''
          new = '''              <>
                <option value={30}>30 sekund · rychlý test</option>
                <option value={60}>1 minuta · rychlý test</option>
                <option value={180}>3 minuty · kratší pokus</option>
                <option value={300}>5 minut · rychlý lokální pokus</option>
                <option value={600}>10 minut · důkladnější hledání</option>
                <option value={1200}>20 minut · Deep Solve</option>
                <option value={LOCAL_DEEP_SOLVE_SECONDS}>
                  30 minut · Deep Solve · doporučeno
                </option>
              </>'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one local option block, got {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          npx prettier --write apps/web/app/generate/page.tsx
          rm .github/workflows/agent-fix-local-deep-solve-options.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep quick checks in local Deep Solve"
          git push origin HEAD:agent/local-deep-solve-school-pe-defaults
