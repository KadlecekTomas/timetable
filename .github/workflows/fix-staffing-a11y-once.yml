name: Fix staffing accessibility once

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-a11y:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Add explicit accessible day label
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/staffing/page.tsx")
          content = path.read_text()
          anchor = "key={day.code}"
          anchor_position = content.find(anchor)
          if anchor_position < 0:
              raise SystemExit("Staffing day button key not found")

          pressed = "aria-pressed={selected}"
          pressed_position = content.find(pressed, anchor_position)
          if pressed_position < 0:
              raise SystemExit("Staffing day aria-pressed anchor not found")

          line_start = content.rfind("\n", 0, pressed_position) + 1
          indentation = content[line_start:pressed_position]
          label = 'aria-label={`${day.shortLabel} ${selected ? "nemůže" : "může"}`}'
          if label in content[anchor_position:pressed_position + 300]:
              raise SystemExit("Accessible day label is already present")

          content = (
              content[:pressed_position]
              + label
              + "\n"
              + indentation
              + content[pressed_position:]
          )
          path.write_text(content)
          PY
      - run: npx prettier --write apps/web/app/staffing/page.tsx
      - name: Commit accessibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/staffing/page.tsx
          git commit -m "fix(staffing): label whole-day availability controls"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
