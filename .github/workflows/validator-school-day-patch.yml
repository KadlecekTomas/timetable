name: Apply school-day validator patch

on:
  push:
    branches:
      - agent/validate-school-day-policy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/validate-school-day-policy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply validator patch
        run: python .github/validator_school_day_patch.py
      - name: Commit validator changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/solver/app/validator.py apps/solver/tests/test_school_day_validation.py apps/web/lib/domain/validation.ts apps/web/tests/school-day-validation.test.ts
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix: validate school-day policy after solve and manual moves'
          git push
