name: Apply universal solver runtime budget

on:
  push:
    branches:
      - agent/fix-vercel-solver-timeout-and-timetable-layout

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-vercel-solver-timeout-and-timetable-layout
          fetch-depth: 0
      - run: python scripts/tmp_make_runtime_budget_universal.py
      - run: |
          rm scripts/tmp_make_runtime_budget_universal.py
          rm .github/workflows/tmp-make-runtime-budget-universal.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make solver runtime budget deployment-safe"
          git push origin HEAD:agent/fix-vercel-solver-timeout-and-timetable-layout
