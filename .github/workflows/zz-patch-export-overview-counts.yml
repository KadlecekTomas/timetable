name: Patch export overview counts

on:
  push:
    branches:
      - feat/client-friendly-excel-template

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-friendly-excel-template
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: python scripts/patch_export_overview_counts.py
      - run: npx prettier --write apps/web/lib/export/timetable-workbook.ts apps/web/tests/timetable-workbook.test.ts apps/web/e2e/full-curriculum.spec.ts
      - run: rm scripts/patch_export_overview_counts.py .github/workflows/zz-patch-export-overview-counts.yml scripts/.patch-export-overview-counts-trigger
      - name: Commit overview count fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/export/timetable-workbook.ts apps/web/tests/timetable-workbook.test.ts apps/web/e2e/full-curriculum.spec.ts scripts/patch_export_overview_counts.py .github/workflows/zz-patch-export-overview-counts.yml scripts/.patch-export-overview-counts-trigger
          git commit -m "fix: count class timetable hours once in export"
          git push origin HEAD:feat/client-friendly-excel-template
