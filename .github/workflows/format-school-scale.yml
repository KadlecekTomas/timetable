name: Format realistic school gate

on:
  push:
    branches: [feat/client-friendly-excel-template]
    paths:
      - .github/workflows/format-school-scale.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/client-friendly-excel-template
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Format changed TypeScript files
        run: |
          npx prettier --write \
            apps/web/e2e/school-scale.spec.ts \
            apps/web/lib/domain/class-groups.ts \
            apps/web/lib/import/school-client-workbook.ts \
            apps/web/lib/import/school-staffing-overrides.ts \
            apps/web/tests/school-client-workbook.test.ts \
            .github/workflows/ci.yml
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/e2e/school-scale.spec.ts \
            apps/web/lib/domain/class-groups.ts \
            apps/web/lib/import/school-client-workbook.ts \
            apps/web/lib/import/school-staffing-overrides.ts \
            apps/web/tests/school-client-workbook.test.ts \
            .github/workflows/ci.yml
          git commit -m "chore: format realistic school gate"
          git push origin HEAD:feat/client-friendly-excel-template
