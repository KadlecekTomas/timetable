name: Build real workbook diagnostic

on:
  push:
    branches:
      - fix/real-2027-import-crash

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/real-2027-import-crash
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build standalone Node diagnostic
        run: >-
          npx --yes esbuild@0.25.8 scripts/diagnose-real-workbook.ts
          --bundle
          --platform=node
          --format=cjs
          --target=node22
          --tsconfig=apps/web/tsconfig.json
          --outfile=diagnostic/diagnose-real-workbook.cjs
      - name: Build standalone browser diagnostic
        run: |
          npx --yes esbuild@0.25.8 scripts/browser-real-workbook-diagnostic.ts \
            --bundle \
            --platform=browser \
            --format=iife \
            --target=chrome120 \
            --tsconfig=apps/web/tsconfig.json \
            --define:process.env.NODE_ENV='"production"' \
            --outfile=diagnostic/browser-real-workbook-diagnostic.js
          cp scripts/browser-real-workbook-diagnostic.html diagnostic/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: real-workbook-diagnostic
          path: diagnostic
          if-no-files-found: error
          retention-days: 1
      - name: Publish diagnostic run id
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > diagnostic/run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic/run-id.txt
          git commit -m "chore: record diagnostic artifact run"
          git push origin HEAD:fix/real-2027-import-crash
