name: Implement browser project sharing

on:
  push:
    branches:
      - feat/browser-project-sharing

permissions:
  contents: write

jobs:
  implement-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/browser-project-sharing
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix binary types
        run: python .github/scripts/fix-project-share-types.py
      - name: Apply UI integration
        run: python .github/scripts/apply-browser-project-sharing.py
      - name: Fix autosave test locator
        run: python .github/scripts/fix-staffing-autosave-test.py
      - name: Install dependencies
        run: npm install
      - name: Format changed files
        run: >-
          npx prettier --write
          apps/web/lib/local/project-share.ts
          apps/web/app/share/page.tsx
          apps/web/app/settings/page.tsx
          apps/web/app/staffing/page.tsx
          apps/web/tests/project-share.test.ts
          apps/web/e2e/project-share.spec.ts
          apps/web/e2e/staffing.spec.ts
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint --workspace @timetable/web
      - name: Typecheck
        run: npm run typecheck --workspace @timetable/web
      - name: Unit tests
        run: npm run test --workspace @timetable/web
      - name: Production build
        run: npm run build --workspace @timetable/web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: apps/web
        shell: bash
        run: |
          npm run dev > /tmp/timetable-share-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/share >/dev/null; then
              break
            fi
            if ! kill -0 "$WEB_PID" 2>/dev/null; then
              cat /tmp/timetable-share-web.log
              exit 1
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3000/share >/dev/null
          npx playwright test e2e/project-share.spec.ts e2e/staffing.spec.ts
      - name: Commit verified implementation
        shell: bash
        run: |
          git rm .github/workflows/patch-browser-project-sharing.yml
          git rm .github/scripts/apply-browser-project-sharing.py
          git rm .github/scripts/fix-project-share-types.py
          git rm .github/scripts/fix-staffing-autosave-test.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web
          git commit -m "feat: share local project without a database"
          git push origin HEAD:feat/browser-project-sharing
