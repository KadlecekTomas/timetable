name: Format Playwright artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write apps/web/e2e/mvp-flow.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-playwright-spec
          path: apps/web/e2e/mvp-flow.spec.ts
          if-no-files-found: error
