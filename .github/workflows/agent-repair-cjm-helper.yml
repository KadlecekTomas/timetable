name: Agent repair CJM helper

on:
  push:
    branches:
      - agent/fix-cjm-same-teacher-rotation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-cjm-same-teacher-rotation
          fetch-depth: 0
      - name: Repair helper replacement indentation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/agent-fix-cjm-import.yml')
          text = p.read_text()
          old = '''          replace(path,
          ''' + "'''" + '''    for (const teacher of resolved) {
              addSubjectHours(
                teacher,
                requirement.subject.code,
                requirement.weeklyPeriods,
              );
            }
          ''' + "'''" + ''',
          '''
          new = '''          replace(path,
          ''' + "'''" + '''    for (const teacher of resolved) {
      addSubjectHours(
        teacher,
        requirement.subject.code,
        requirement.weeklyPeriods,
      );
    }
          ''' + "'''" + ''',
          '''
          if old not in text:
              raise SystemExit('Expected helper block not found')
          p.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/agent-fix-cjm-import.yml
          git commit -m "chore: repair CJM helper replacement"
          git push origin HEAD:agent/fix-cjm-same-teacher-rotation
