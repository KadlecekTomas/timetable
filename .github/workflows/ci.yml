name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-solver-lint:
    if: github.head_ref == 'agent/local-deep-solve-school-pe-defaults'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-deep-solve-school-pe-defaults
          fetch-depth: 0
      - name: Fix long diagnostic line and restore CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/solver/app/main.py")
          text = path.read_text()
          old = '''                "Odpolední hodiny aktivně preferují TV, PČ, VV, SVS a VKZ; HV, PřPk a PkČj jsou záložní odpolední předměty. Jádrové předměty zůstávají prioritně dříve."
          '''
          new = '''                "Odpolední hodiny aktivně preferují TV, PČ, VV, SVS a VKZ; "
                          "HV, PřPk a PkČj jsou záložní odpolední předměty. "
                          "Jádrové předměty zůstávají prioritně dříve."
          '''
          if old not in text:
              raise SystemExit("diagnostic line not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/solver/app/main.py .github/workflows/ci.yml
          git commit -m "Fix solver afternoon diagnostic formatting"
          git push origin HEAD:agent/local-deep-solve-school-pe-defaults
