name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      SOLVER_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prepare exact 2027 workbook compatibility patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          teaching = "apps/web/lib/local/teaching-plan-school-v2.ts"
          replace(
              teaching,
              '''import {
            createDefaultSchoolCurriculum,
            SCHOOL_SPLIT_SUBJECT_CODES,
          } from "./school-default-data";''',
              '''import { createDefaultSchoolCurriculum } from "./school-default-data";''',
          )
          replace(
              teaching,
              '''function allocationRows(
            draft: StaffingAllocationDraft | null,
            classCode: string,
            subjectCode: string,
          ): StaffingAllocationDraftRow[] {
            return (
              draft?.rows.filter(
                (row) => row.classCode === classCode && row.subjectCode === subjectCode,
              ) ?? []
            );
          }

          function candidateTeacherIds(
            draft: StaffingAllocationDraft | null,
            classCode: string,
            subjectCode: string,
          ): { primaryTeacherId: string; secondaryTeacherId: string } {
            const candidates = allocationRows(draft, classCode, subjectCode);
            const group1 = candidates.find((item) => item.group === "GROUP_1");
            const group2 = candidates.find((item) => item.group === "GROUP_2");
            const whole = candidates.find((item) => item.group === "WHOLE");
            const all = [
              ...new Set(candidates.flatMap((item) => item.teacherIds).filter(Boolean)),
            ];
            const primaryTeacherId =
              group1?.teacherIds[0] ?? whole?.teacherIds[0] ?? all[0] ?? "";
            const secondaryTeacherId =
              group2?.teacherIds[0] ??
              whole?.teacherIds.find((teacherId) => teacherId !== primaryTeacherId) ??
              all.find((teacherId) => teacherId !== primaryTeacherId) ??
              "";
            return { primaryTeacherId, secondaryTeacherId };
          }

          function organizationForRow(
            row: TeachingPlanRow,
            mustSplit: boolean,
            candidateSecondaryTeacherId: string,
          ): TeachingOrganization {
            if (row.organization === "ROTATION") return "ROTATION";
            if (mustSplit) return "SPLIT";
            if (row.organization === "SPLIT" || candidateSecondaryTeacherId) {
              return "SPLIT";
            }
            return "WHOLE";
          }''',
              '''const ELECTIVE_ALLOCATION_CODES = new Set(["VOL", "PRPK", "SVS"]);

          function allocationSubjectMatches(
            planSubjectCode: string,
            draftSubjectCode: string,
          ): boolean {
            return planSubjectCode === "VOL"
              ? ELECTIVE_ALLOCATION_CODES.has(draftSubjectCode)
              : planSubjectCode === draftSubjectCode;
          }

          function allocationRows(
            draft: StaffingAllocationDraft | null,
            classCode: string,
            subjectCode: string,
          ): StaffingAllocationDraftRow[] {
            return (
              draft?.rows.filter(
                (row) =>
                  row.classCode === classCode &&
                  allocationSubjectMatches(subjectCode, row.subjectCode),
              ) ?? []
            );
          }

          function candidateTeacherIds(
            draft: StaffingAllocationDraft | null,
            classCode: string,
            subjectCode: string,
          ): {
            primaryTeacherId: string;
            secondaryTeacherId: string;
            split: boolean;
          } {
            const candidates = allocationRows(draft, classCode, subjectCode);
            const group1 = candidates.find((item) => item.group === "GROUP_1");
            const group2 = candidates.find((item) => item.group === "GROUP_2");
            const whole = candidates.find((item) => item.group === "WHOLE");
            const all = [
              ...new Set(candidates.flatMap((item) => item.teacherIds).filter(Boolean)),
            ];
            const explicitGroupCount = candidates.filter(
              (item) => item.group !== "WHOLE",
            ).length;
            const split = explicitGroupCount >= 2 || all.length >= 2;

            if (!split) {
              return {
                primaryTeacherId:
                  group1?.teacherIds[0] ??
                  group2?.teacherIds[0] ??
                  whole?.teacherIds[0] ??
                  all[0] ??
                  "",
                secondaryTeacherId: "",
                split: false,
              };
            }

            const primaryTeacherId = group1
              ? (group1.teacherIds[0] ?? "")
              : (whole?.teacherIds[0] ?? all[0] ?? "");
            const secondaryTeacherId = group2
              ? (group2.teacherIds[0] ?? "")
              : (all.find((teacherId) => teacherId !== primaryTeacherId) ?? "");
            return { primaryTeacherId, secondaryTeacherId, split: true };
          }

          function organizationForRow(
            row: TeachingPlanRow,
            enforceSchoolDefaults: boolean,
            hasAllocationDraft: boolean,
            candidateSplit: boolean,
            candidateSecondaryTeacherId: string,
          ): TeachingOrganization {
            if (row.organization === "ROTATION") return "ROTATION";
            if (enforceSchoolDefaults && hasAllocationDraft) {
              if (candidateSplit) return "SPLIT";
              if (row.organization === "SPLIT" && row.secondaryTeacherId) {
                return "SPLIT";
              }
              return "WHOLE";
            }
            if (row.organization === "SPLIT" || candidateSecondaryTeacherId) {
              return "SPLIT";
            }
            return "WHOLE";
          }''',
          )
          replace(
              teaching,
              '''  const candidates = candidateTeacherIds(draft, row.classCode, row.subjectCode);
            const mustSplit =
              enforceSchoolDefaults && SCHOOL_SPLIT_SUBJECT_CODES.has(row.subjectCode);
            const organization = organizationForRow(
              row,
              mustSplit,
              candidates.secondaryTeacherId,
            );''',
              '''  const candidates = candidateTeacherIds(draft, row.classCode, row.subjectCode);
            const organization = organizationForRow(
              row,
              enforceSchoolDefaults,
              draft !== null,
              candidates.split,
              candidates.secondaryTeacherId,
            );''',
          )

          curriculum = "apps/web/lib/import/school-curriculum-workbook.ts"
          replace(
              curriculum,
              '''function allocationRows(
            draft: StaffingAllocationDraft | null,
            classCode: string,
            subjectCode: string,
          ) {
            return (
              draft?.rows.filter(
                (row) => row.classCode === classCode && row.subjectCode === subjectCode,
              ) ?? []
            );
          }''',
              '''const ELECTIVE_ALLOCATION_CODES = new Set(["VOL", "PRPK", "SVS"]);

          function allocationSubjectMatches(
            planSubjectCode: string,
            draftSubjectCode: string,
          ): boolean {
            return planSubjectCode === "VOL"
              ? ELECTIVE_ALLOCATION_CODES.has(draftSubjectCode)
              : planSubjectCode === draftSubjectCode;
          }

          function allocationRows(
            draft: StaffingAllocationDraft | null,
            classCode: string,
            subjectCode: string,
          ) {
            return (
              draft?.rows.filter(
                (row) =>
                  row.classCode === classCode &&
                  allocationSubjectMatches(subjectCode, row.subjectCode),
              ) ?? []
            );
          }''',
          )
          replace(
              curriculum,
              '''  const group1 = candidates.find((item) => item.group === "GROUP_1");
            const group2 = candidates.find((item) => item.group === "GROUP_2");
            if (group1 || group2) {
              const primaryTeacherId = group1?.teacherIds[0] ?? "";
              const secondaryTeacherId = group2?.teacherIds[0] ?? "";
              if (!primaryTeacherId || !secondaryTeacherId) {
                issues.push(
                  issue(
                    "WARNING",
                    group1?.sourceSheet ?? group2?.sourceSheet ?? sheetName,
                    group1?.sourceRow ?? group2?.sourceRow ?? null,
                    `${row.classCode} ${row.subjectCode}`,
                    `${row.classCode} · ${row.subjectCode}: jedna z paralelních skupin zatím nemá učitele.`,
                  ),
                );
              }
              for (const candidate of [group1, group2]) {
                if (candidate && candidate.weeklyPeriods !== row.weeklyPeriods) {
                  issues.push(
                    issue(
                      "WARNING",
                      candidate.sourceSheet,
                      candidate.sourceRow,
                      `${row.classCode} ${row.subjectCode}`,
                      `Staré přiřazení obsahuje ${candidate.weeklyPeriods} h, nový učební plán vyžaduje ${row.weeklyPeriods} h. Použita byla nová časová dotace.`,
                    ),
                  );
                }
              }
              return {
                ...row,
                organization: "SPLIT",
                primaryTeacherId,
                secondaryTeacherId,
              };
            }

            const candidate = candidates[0]!;''',
              '''  const group1 = candidates.find((item) => item.group === "GROUP_1");
            const group2 = candidates.find((item) => item.group === "GROUP_2");
            const whole = candidates.find((item) => item.group === "WHOLE");
            const allTeacherIds = [
              ...new Set(candidates.flatMap((item) => item.teacherIds).filter(Boolean)),
            ];
            const explicitGroupCount = candidates.filter(
              (item) => item.group !== "WHOLE",
            ).length;
            const shouldSplit = explicitGroupCount >= 2 || allTeacherIds.length >= 2;

            if (shouldSplit) {
              const primaryTeacherId = group1
                ? (group1.teacherIds[0] ?? "")
                : (whole?.teacherIds[0] ?? allTeacherIds[0] ?? "");
              const secondaryTeacherId = group2
                ? (group2.teacherIds[0] ?? "")
                : (allTeacherIds.find(
                    (teacherId) => teacherId !== primaryTeacherId,
                  ) ?? "");
              if (!primaryTeacherId || !secondaryTeacherId) {
                issues.push(
                  issue(
                    "WARNING",
                    group1?.sourceSheet ?? group2?.sourceSheet ?? sheetName,
                    group1?.sourceRow ?? group2?.sourceRow ?? null,
                    `${row.classCode} ${row.subjectCode}`,
                    `${row.classCode} · ${row.subjectCode}: jedna z paralelních skupin zatím nemá učitele.`,
                  ),
                );
              }
              for (const candidate of candidates) {
                if (candidate.weeklyPeriods !== row.weeklyPeriods) {
                  issues.push(
                    issue(
                      "WARNING",
                      candidate.sourceSheet,
                      candidate.sourceRow,
                      `${row.classCode} ${row.subjectCode}`,
                      `Staré přiřazení obsahuje ${candidate.weeklyPeriods} h, nový učební plán vyžaduje ${row.weeklyPeriods} h. Použita byla nová časová dotace.`,
                    ),
                  );
                }
              }
              return {
                ...row,
                organization: "SPLIT",
                primaryTeacherId,
                secondaryTeacherId,
              };
            }

            const candidate = candidates[0]!;''',
          )
          replace(
              curriculum,
              '''  if (draft) {
            const activeKeys = new Set(
              plan.rows.map((row) => `${row.classCode}|${row.subjectCode}`),
            );
            for (const item of draft.rows) {
              if (!activeKeys.has(`${item.classCode}|${item.subjectCode}`)) {
                issues.push(
                  issue(
                    "WARNING",
                    item.sourceSheet,
                    item.sourceRow,
                    `${item.classCode} ${item.subjectCode}`,
                    `${item.classCode} · ${item.subjectCode}: staré přiřazení není v novém učebním plánu a nebylo převzato.`,
                  ),
                );
              }
            }
          }''',
              '''  if (draft) {
            for (const item of draft.rows) {
              const active = plan.rows.some(
                (row) =>
                  row.classCode === item.classCode &&
                  allocationSubjectMatches(row.subjectCode, item.subjectCode),
              );
              if (!active) {
                issues.push(
                  issue(
                    "WARNING",
                    item.sourceSheet,
                    item.sourceRow,
                    `${item.classCode} ${item.subjectCode}`,
                    `${item.classCode} · ${item.subjectCode}: staré přiřazení není v novém učebním plánu a nebylo převzato.`,
                  ),
                );
              }
            }
          }''',
          )
          PY
          npx prettier --write apps/web/lib/local/teaching-plan-school-v2.ts apps/web/lib/import/school-curriculum-workbook.ts
      - name: Upload exact 2027 compatibility files
        uses: actions/upload-artifact@v4
        with:
          name: exact-2027-compatibility-files
          path: |
            apps/web/lib/local/teaching-plan-school-v2.ts
            apps/web/lib/import/school-curriculum-workbook.ts
          if-no-files-found: error
      - run: npm run format:check
      - run: npm run lint --workspace @timetable/web
      - run: npm run typecheck --workspace @timetable/web
      - run: npm run test --workspace @timetable/web
      - run: npm run build --workspace @timetable/web

  solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
        working-directory: apps/solver
      - run: ruff check apps/solver
      - run: pytest apps/solver

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build
      - name: Start database-free Docker stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify web and proxied solver runtime
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health
          curl --fail --silent --show-error http://127.0.0.1:3000/solver/health
          curl --fail --silent --show-error http://127.0.0.1:8000/health
      - name: Show container diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Stop Docker stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  local-first-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOLVER_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm install
      - run: pip install "."
        working-directory: apps/solver
      - run: npx playwright install --with-deps chromium
      - name: Build web without a database
        run: npm run build --workspace @timetable/web
      - name: Start solver and web
        shell: bash
        run: |
          nohup bash -c 'cd apps/solver && uvicorn app.main:app --host 127.0.0.1 --port 8000' > /tmp/solver.log 2>&1 &
          nohup npm run start --workspace @timetable/web > /tmp/web.log 2>&1 &

          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null && \
               curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null && \
               curl --fail --silent http://127.0.0.1:3000/solver/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/solver.log || true
          cat /tmp/web.log || true
          exit 1
      - name: Run database-free browser workflows
        run: npm run e2e --workspace @timetable/web -- e2e/local-first.spec.ts e2e/local-first-backup.spec.ts e2e/timetable-export.spec.ts e2e/staffing.spec.ts e2e/teaching-plan.spec.ts e2e/teaching-plan-import-review.spec.ts e2e/subject-rotation-and-sports.spec.ts e2e/coverage-overview.spec.ts --retries=0
      - name: Upload detailed teaching-plan screenshots and Excel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teaching-plan-ui-screenshots-and-workbook
          path: |
            apps/web/test-results/teaching-plan-screenshots
            apps/web/test-results/teaching-plan-review-screenshots
            apps/web/test-results/subject-rotation-screenshots
            apps/web/test-results/coverage-screenshots
          if-no-files-found: warn
      - name: Run realistic 40-teacher school workflow
        run: npm run e2e --workspace @timetable/web -- e2e/school-scale.spec.ts --retries=0
      - name: Run full 122-hour curriculum and leadership export
        run: npm run e2e --workspace @timetable/web -- e2e/full-curriculum.spec.ts --retries=0
      - name: Upload full-curriculum leadership export
        uses: actions/upload-artifact@v4
        with:
          name: leadership-full-curriculum-timetable
          path: /tmp/rozvrh-vedeni-plny-druhy-stupen.xlsx
          if-no-files-found: error
      - name: Repeat critical local-first workflow three times
        run: npm run e2e --workspace @timetable/web -- e2e/local-first.spec.ts --repeat-each=3 --retries=0
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-first-failure
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
