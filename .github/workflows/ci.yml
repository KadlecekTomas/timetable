name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-policy-e2e:
    if: github.head_ref == 'agent/local-deep-solve-school-pe-defaults'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-deep-solve-school-pe-defaults
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format browser policy test and restore CI
        shell: bash
        run: |
          npx prettier --write apps/web/e2e/school-scheduling-policy.spec.ts
          git checkout HEAD^ -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/school-scheduling-policy.spec.ts .github/workflows/ci.yml
          git commit -m "Format school scheduling policy browser test"
          git push origin HEAD:agent/local-deep-solve-school-pe-defaults
