name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write apps/web/e2e/actual-2027-workbook.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-actual-2027-browser-test
          path: apps/web/e2e/actual-2027-workbook.spec.ts
          if-no-files-found: error
      - run: npm run format:check
