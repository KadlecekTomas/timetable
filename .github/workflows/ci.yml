name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-school-scheduling-policy:
    if: github.head_ref == 'agent/local-deep-solve-school-pe-defaults'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-deep-solve-school-pe-defaults
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply scheduling policy and restore CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path("apps/solver/app/main.py")
          main = main_path.read_text()
          if "SUBJECT_AFTERNOON_BONUSES" not in main:
              marker = "DEFAULT_SUBJECT_LATE_WEIGHT = 300\n"
              addition = '''SUBJECT_AFTERNOON_BONUSES = {
              "TV": 1_800,
              "PC": 1_500,
              "VV": 1_500,
              "SVS": 1_300,
              "VZ": 1_300,
              "VKZ": 1_300,
              "HV": 350,
              "PRPK": 300,
              "PKCJ": 300,
          }
          '''
              if marker not in main:
                  raise SystemExit("subject priority marker missing")
              main = main.replace(marker, addition + marker, 1)

          old_cost = '''    subject_code = _subject_code(payload, assignment.subject_id)
              weight = SUBJECT_LATE_WEIGHTS.get(
                  subject_code,
                  DEFAULT_SUBJECT_LATE_WEIGHT,
              )
              return afternoon_distance * weight
          '''
          new_cost = '''    subject_code = _subject_code(payload, assignment.subject_id)
              afternoon_bonus = SUBJECT_AFTERNOON_BONUSES.get(subject_code, 0)
              if afternoon_bonus > 0:
                  return -afternoon_distance * afternoon_bonus
              weight = SUBJECT_LATE_WEIGHTS.get(
                  subject_code,
                  DEFAULT_SUBJECT_LATE_WEIGHT,
              )
              return afternoon_distance * weight
          '''
          if old_cost not in main:
              raise SystemExit("late cost block missing")
          main = main.replace(old_cost, new_cost, 1)
          main = main.replace(
              '"Pozdní hodiny přednostně využívají pohybové, výtvarné a praktické předměty před matematikou, jazyky a informatikou."',
              '"Odpolední hodiny aktivně preferují TV, PČ, VV, SVS a VKZ; HV, PřPk a PkČj jsou záložní odpolední předměty. Jádrové předměty zůstávají prioritně dříve."',
          )
          main_path.write_text(main)

          generation_path = Path("apps/web/lib/local/school-project-generation.ts")
          generation = generation_path.read_text()
          import_marker = 'import { schoolInputFingerprint } from "./school-input-state";\n'
          scheduling_import = 'import { schoolSchedulingPreferences } from "./school-scheduling-preferences";\n'
          if scheduling_import not in generation:
              if import_marker not in generation:
                  raise SystemExit("generation import marker missing")
              generation = generation.replace(
                  import_marker,
                  import_marker + scheduling_import,
                  1,
              )

          availability_block = '''  const availability = [
              ...teacherAvailability,
              ...physicalEducationAvailability,
            ];

            const project: LocalProject = blockers.length
          '''
          availability_replacement = '''  const availability = [
              ...teacherAvailability,
              ...physicalEducationAvailability,
            ];
            const retainedFixedLessons = existingProject.fixedLessons.filter((lesson) =>
              assignments.some((assignment) => assignment.id === lesson.assignmentId),
            );
            const schedulingPreferences = schoolSchedulingPreferences({
              assignments,
              subjects,
              staffingPlan,
              existingFixedLessons: retainedFixedLessons,
            });
            warnings.push(...schedulingPreferences.warnings);
            availability.push(...schedulingPreferences.availability);
            const fixedLessons = [
              ...retainedFixedLessons,
              ...schedulingPreferences.fixedLessons,
            ];

            const project: LocalProject = blockers.length
          '''
          if availability_block not in generation:
              raise SystemExit("generation availability block missing")
          generation = generation.replace(
              availability_block,
              availability_replacement,
              1,
          )

          old_fixed = '''        fixedLessons: existingProject.fixedLessons.filter((lesson) =>
                    assignments.some(
                      (assignment) => assignment.id === lesson.assignmentId,
                    ),
                  ),
          '''
          if old_fixed not in generation:
              raise SystemExit("generation fixed lesson block missing")
          generation = generation.replace(old_fixed, "        fixedLessons,\n", 1)
          generation_path.write_text(generation)
          PY

          npx prettier --write \
            apps/web/lib/local/school-project-generation.ts \
            apps/web/lib/local/school-scheduling-preferences.ts \
            apps/web/tests/school-scheduling-preferences.test.ts \
            apps/web/tests/school-scheduling-preferences-generation.test.ts

          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml \
            apps/solver/app/main.py \
            apps/solver/tests/test_subject_priorities.py \
            apps/web/lib/local/school-project-generation.ts \
            apps/web/lib/local/school-scheduling-preferences.ts \
            apps/web/tests/school-scheduling-preferences.test.ts \
            apps/web/tests/school-scheduling-preferences-generation.test.ts
          git commit -m "Add afternoon priorities and Špánková schedule"
          git push origin HEAD:agent/local-deep-solve-school-pe-defaults
