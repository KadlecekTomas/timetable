name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      SOLVER_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff
        run: npm run format && git diff --exit-code

  solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
        working-directory: apps/solver
      - name: Print exact Ruff diff
        run: ruff check --fix apps/solver && git diff --exit-code

  full-school-solver:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Formatting diagnostic only"

  containers:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Formatting diagnostic only"

  local-first-e2e:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Formatting diagnostic only"
