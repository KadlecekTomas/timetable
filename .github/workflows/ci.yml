name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    env:
      SOLVER_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prepare exact 2027 workbook compatibility files
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(text: str, start_marker: str, end_marker: str, replacement: str) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          teaching_path = Path("apps/web/lib/local/teaching-plan-school-v2.ts")
          teaching = teaching_path.read_text()
          teaching = teaching.replace(
              '''import {
            createDefaultSchoolCurriculum,
            SCHOOL_SPLIT_SUBJECT_CODES,
          } from "./school-default-data";''',
              '''import { createDefaultSchoolCurriculum } from "./school-default-data";''',
              1,
          )
          teaching_helpers = '''const ELECTIVE_ALLOCATION_CODES = new Set(["VOL", "PRPK", "SVS"]);

          function allocationSubjectMatches(
            planSubjectCode: string,
            draftSubjectCode: string,
          ): boolean {
            return planSubjectCode === "VOL"
              ? ELECTIVE_ALLOCATION_CODES.has(draftSubjectCode)
              : planSubjectCode === draftSubjectCode;
          }

          function allocationRows(
            draft: StaffingAllocationDraft | null,
            classCode: string,
            subjectCode: string,
          ): StaffingAllocationDraftRow[] {
            return (
              draft?.rows.filter(
                (row) =>
                  row.classCode === classCode &&
                  allocationSubjectMatches(subjectCode, row.subjectCode),
              ) ?? []
            );
          }

          function candidateTeacherIds(
            draft: StaffingAllocationDraft | null,
            classCode: string,
            subjectCode: string,
          ): {
            primaryTeacherId: string;
            secondaryTeacherId: string;
            split: boolean;
          } {
            const candidates = allocationRows(draft, classCode, subjectCode);
            const group1 = candidates.find((item) => item.group === "GROUP_1");
            const group2 = candidates.find((item) => item.group === "GROUP_2");
            const whole = candidates.find((item) => item.group === "WHOLE");
            const all = [
              ...new Set(candidates.flatMap((item) => item.teacherIds).filter(Boolean)),
            ];
            const explicitGroupCount = candidates.filter(
              (item) => item.group !== "WHOLE",
            ).length;
            const split = explicitGroupCount >= 2 || all.length >= 2;

            if (!split) {
              return {
                primaryTeacherId:
                  group1?.teacherIds[0] ??
                  group2?.teacherIds[0] ??
                  whole?.teacherIds[0] ??
                  all[0] ??
                  "",
                secondaryTeacherId: "",
                split: false,
              };
            }

            const primaryTeacherId = group1
              ? (group1.teacherIds[0] ?? "")
              : (whole?.teacherIds[0] ?? all[0] ?? "");
            const secondaryTeacherId = group2
              ? (group2.teacherIds[0] ?? "")
              : (all.find((teacherId) => teacherId !== primaryTeacherId) ?? "");
            return { primaryTeacherId, secondaryTeacherId, split: true };
          }

          function organizationForRow(
            row: TeachingPlanRow,
            enforceSchoolDefaults: boolean,
            hasAllocationDraft: boolean,
            candidateSplit: boolean,
            candidateSecondaryTeacherId: string,
          ): TeachingOrganization {
            if (row.organization === "ROTATION") return "ROTATION";
            if (enforceSchoolDefaults && hasAllocationDraft) {
              if (candidateSplit) return "SPLIT";
              if (row.organization === "SPLIT" && row.secondaryTeacherId) {
                return "SPLIT";
              }
              return "WHOLE";
            }
            if (row.organization === "SPLIT" || candidateSecondaryTeacherId) {
              return "SPLIT";
            }
            return "WHOLE";
          }

          '''
          teaching = replace_between(
              teaching,
              "function allocationRows(",
              "function operationalRow(",
              teaching_helpers,
          )
          operational_start = teaching.index("function operationalRow(")
          candidates_start = teaching.index("  const candidates = candidateTeacherIds(", operational_start)
          ninth_start = teaching.index("  const isNinthGradeRegularTv =", candidates_start)
          teaching = (
              teaching[:candidates_start]
              + '''  const candidates = candidateTeacherIds(
            draft,
            row.classCode,
            row.subjectCode,
          );
            const organization = organizationForRow(
              row,
              enforceSchoolDefaults,
              draft !== null,
              candidates.split,
              candidates.secondaryTeacherId,
            );
          '''
              + teaching[ninth_start:]
          )
          teaching_path.write_text(teaching)

          curriculum_path = Path("apps/web/lib/import/school-curriculum-workbook.ts")
          curriculum = curriculum_path.read_text()
          curriculum_helpers = '''const ELECTIVE_ALLOCATION_CODES = new Set(["VOL", "PRPK", "SVS"]);

          function allocationSubjectMatches(
            planSubjectCode: string,
            draftSubjectCode: string,
          ): boolean {
            return planSubjectCode === "VOL"
              ? ELECTIVE_ALLOCATION_CODES.has(draftSubjectCode)
              : planSubjectCode === draftSubjectCode;
          }

          function allocationRows(
            draft: StaffingAllocationDraft | null,
            classCode: string,
            subjectCode: string,
          ) {
            return (
              draft?.rows.filter(
                (row) =>
                  row.classCode === classCode &&
                  allocationSubjectMatches(subjectCode, row.subjectCode),
              ) ?? []
            );
          }

          '''
          curriculum = replace_between(
              curriculum,
              "function allocationRows(",
              "function assignmentForRow(",
              curriculum_helpers,
          )
          assignment_start = curriculum.index("function assignmentForRow(")
          groups_start = curriculum.index("  const group1 =", assignment_start)
          candidate_start = curriculum.index("  const candidate = candidates[0]!;", groups_start)
          group_logic = '''  const group1 = candidates.find((item) => item.group === "GROUP_1");
            const group2 = candidates.find((item) => item.group === "GROUP_2");
            const whole = candidates.find((item) => item.group === "WHOLE");
            const allTeacherIds = [
              ...new Set(candidates.flatMap((item) => item.teacherIds).filter(Boolean)),
            ];
            const explicitGroupCount = candidates.filter(
              (item) => item.group !== "WHOLE",
            ).length;
            const shouldSplit = explicitGroupCount >= 2 || allTeacherIds.length >= 2;

            if (shouldSplit) {
              const primaryTeacherId = group1
                ? (group1.teacherIds[0] ?? "")
                : (whole?.teacherIds[0] ?? allTeacherIds[0] ?? "");
              const secondaryTeacherId = group2
                ? (group2.teacherIds[0] ?? "")
                : (allTeacherIds.find(
                    (teacherId) => teacherId !== primaryTeacherId,
                  ) ?? "");
              if (!primaryTeacherId || !secondaryTeacherId) {
                issues.push(
                  issue(
                    "WARNING",
                    group1?.sourceSheet ?? group2?.sourceSheet ?? sheetName,
                    group1?.sourceRow ?? group2?.sourceRow ?? null,
                    `${row.classCode} ${row.subjectCode}`,
                    `${row.classCode} · ${row.subjectCode}: jedna z paralelních skupin zatím nemá učitele.`,
                  ),
                );
              }
              for (const candidate of candidates) {
                if (candidate.weeklyPeriods !== row.weeklyPeriods) {
                  issues.push(
                    issue(
                      "WARNING",
                      candidate.sourceSheet,
                      candidate.sourceRow,
                      `${row.classCode} ${row.subjectCode}`,
                      `Staré přiřazení obsahuje ${candidate.weeklyPeriods} h, nový učební plán vyžaduje ${row.weeklyPeriods} h. Použita byla nová časová dotace.`,
                    ),
                  );
                }
              }
              return {
                ...row,
                organization: "SPLIT",
                primaryTeacherId,
                secondaryTeacherId,
              };
            }

          '''
          curriculum = curriculum[:groups_start] + group_logic + curriculum[candidate_start:]
          active_start = curriculum.index("  if (draft) {\n    const activeKeys")
          active_end = curriculum.index("\n\n  return plan;", active_start)
          active_logic = '''  if (draft) {
            for (const item of draft.rows) {
              const active = plan.rows.some(
                (row) =>
                  row.classCode === item.classCode &&
                  allocationSubjectMatches(row.subjectCode, item.subjectCode),
              );
              if (!active) {
                issues.push(
                  issue(
                    "WARNING",
                    item.sourceSheet,
                    item.sourceRow,
                    `${item.classCode} ${item.subjectCode}`,
                    `${item.classCode} · ${item.subjectCode}: staré přiřazení není v novém učebním plánu a nebylo převzato.`,
                  ),
                );
              }
            }
          }'''
          curriculum = curriculum[:active_start] + active_logic + curriculum[active_end:]
          curriculum_path.write_text(curriculum)
          PY
          npx prettier --write apps/web/lib/local/teaching-plan-school-v2.ts apps/web/lib/import/school-curriculum-workbook.ts
      - name: Upload exact 2027 compatibility files
        uses: actions/upload-artifact@v4
        with:
          name: exact-2027-compatibility-files
          path: |
            apps/web/lib/local/teaching-plan-school-v2.ts
            apps/web/lib/import/school-curriculum-workbook.ts
          if-no-files-found: error
      - run: npm run format:check
      - run: npm run lint --workspace @timetable/web
      - run: npm run typecheck --workspace @timetable/web
      - run: npm run test --workspace @timetable/web
      - run: npm run build --workspace @timetable/web
