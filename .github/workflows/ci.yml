name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-client-settings-row:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && github.head_ref == 'feat/client-friendly-excel-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Patch settings row handling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/lib/import/client-workbook.ts')
          text = path.read_text()

          old_defaults = '''  workbook
            .getWorksheet(CLIENT_TEMPLATE_SHEET_NAMES.settings)!
            .getRow(CLIENT_TEMPLATE_FIRST_DATA_ROW).values = [
            undefined,
            "2026/2027",
            8,
            8,
            8,
            8,
            7,
          ];'''
          new_defaults = '''  const settings = workbook.getWorksheet(
            CLIENT_TEMPLATE_SHEET_NAMES.settings,
          )!;
          ["2026/2027", 8, 8, 8, 8, 7].forEach((value, index) => {
            settings.getCell(CLIENT_TEMPLATE_FIRST_DATA_ROW, index + 1).value = value;
          });'''
          if old_defaults not in text:
              raise SystemExit('Missing settings default block')
          text = text.replace(old_defaults, new_defaults)

          old_loop = '''    let targetRow = 2;
            for (let row = header.row + 1; row <= source.actualRowCount; row += 1) {'''
          new_loop = '''    let targetRow = 2;
            for (
              let row = header.row + 1;
              row <= CLIENT_TEMPLATE_LAST_DATA_ROW;
              row += 1
            ) {'''
          if old_loop not in text:
              raise SystemExit('Missing normalization loop')
          text = text.replace(old_loop, new_loop)

          path.write_text(text)
          PY
          npx prettier --write apps/web/lib/import/client-workbook.ts
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/import/client-workbook.ts
          git commit -m "fix: normalize the client settings row reliably"
          git push origin HEAD:${{ github.head_ref }}

  web:
    runs-on: ubuntu-latest
    env:
      SOLVER_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run format:check
      - run: npm run lint --workspace @timetable/web
      - run: npm run typecheck --workspace @timetable/web
      - run: npm run test --workspace @timetable/web
      - run: npm run build --workspace @timetable/web

  solver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
        working-directory: apps/solver
      - run: ruff check apps/solver
      - run: pytest apps/solver

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build
      - name: Start database-free Docker stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify web and proxied solver runtime
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health
          curl --fail --silent --show-error http://127.0.0.1:3000/solver/health
          curl --fail --silent --show-error http://127.0.0.1:8000/health
      - name: Show container diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Stop Docker stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  local-first-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOLVER_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm install
      - run: pip install "."
        working-directory: apps/solver
      - run: npx playwright install --with-deps chromium
      - name: Build web without a database
        run: npm run build --workspace @timetable/web
      - name: Start solver and web
        shell: bash
        run: |
          nohup bash -c 'cd apps/solver && uvicorn app.main:app --host 127.0.0.1 --port 8000' > /tmp/solver.log 2>&1 &
          nohup npm run start --workspace @timetable/web > /tmp/web.log 2>&1 &

          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null && \
               curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null && \
               curl --fail --silent http://127.0.0.1:3000/solver/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/solver.log || true
          cat /tmp/web.log || true
          exit 1
      - name: Run database-free browser workflows
        run: npm run e2e --workspace @timetable/web -- e2e/local-first.spec.ts e2e/local-first-backup.spec.ts --retries=0
      - name: Repeat critical local-first workflow three times
        run: npm run e2e --workspace @timetable/web -- e2e/local-first.spec.ts --repeat-each=3 --retries=0
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-first-failure
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
