name: Agent exact teacher unavailability final2

on:
  push:
    branches:
      - agent/fix-project-delete-and-school-groups

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-project-delete-and-school-groups
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Apply exact availability patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          lines = Path('.github/workflows/agent-exact-teacher-unavailability.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script_lines = [line[10:] if line.startswith('          ') else line for line in lines[start:end]]
          script = '\n'.join(script_lines) + '\n'
          old_helper = '''def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Missing block in {path}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))
          '''
          new_helper = '''def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  return
              parts = re.split(r"(\\s+)", old)
              pattern = "".join(r"\\s+" if part.isspace() else re.escape(part) for part in parts if part)
              updated, count = re.subn(pattern, lambda _m: new, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Missing block in {path}: {old[:160]!r}")
              p.write_text(updated)
          '''
          script = 'import re\n' + script.replace(old_helper, new_helper, 1)
          exec(compile(script, '<exact-teacher-unavailability>', 'exec'))

          e2e = Path('apps/web/e2e/staffing.spec.ts')
          text = e2e.read_text()
          if 'period: number;' not in text[text.find('availability: Array<{'):text.find('availability: Array<{') + 220]:
              pattern = re.compile(r'(availability:\s*Array<\{\s*entityType:\s*string;\s*dayOfWeek:\s*number;)')
              text, count = pattern.subn(lambda match: match.group(1) + '\n            period: number;', text, count=1)
              if count != 1:
                  raise SystemExit('availability type pattern not found')
          e2e.write_text(text)
          PY
          npx prettier --write apps/web/lib/local/staffing-plan.ts apps/web/app/staffing/page.tsx apps/web/e2e/staffing.spec.ts
      - name: Verify web gate
        shell: bash
        run: |
          npm run format:check
          npm run lint --workspace @timetable/web
          npm run typecheck --workspace @timetable/web
          npm run test --workspace @timetable/web
      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/local/staffing-plan.ts apps/web/app/staffing/page.tsx apps/web/e2e/staffing.spec.ts
          git commit -m "feat: add exact teacher unavailability slots"
          git push origin HEAD:agent/fix-project-delete-and-school-groups
