name: Prepare MVP verification assets

on:
  pull_request:
    branches:
      - feat/design-foundation

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Prepare production assets
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("package.json")
          package = json.loads(root.read_text())
          package["scripts"]["db:deploy"] = "npm run prisma:deploy --workspace @timetable/database"
          root.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n")

          database_package_path = Path("packages/database/package.json")
          database_package = json.loads(database_package_path.read_text())
          database_package["scripts"]["prisma:deploy"] = "prisma migrate deploy"
          database_package_path.write_text(
              json.dumps(database_package, ensure_ascii=False, indent=2) + "\n"
          )

          Path("apps/web/Dockerfile").write_text('''FROM node:22-alpine AS builder
          WORKDIR /app
          COPY . .
          RUN npm install
          RUN npm run db:generate
          RUN npm run build --workspace @timetable/database
          RUN npm run build --workspace @timetable/web

          FROM node:22-alpine AS runner
          WORKDIR /app
          ENV NODE_ENV=production
          ENV PORT=3000
          COPY --from=builder /app/apps/web/.next/standalone ./
          COPY --from=builder /app/apps/web/.next/static ./apps/web/.next/static
          EXPOSE 3000
          CMD ["node", "apps/web/server.js"]
          ''')

          Path("apps/worker/Dockerfile").write_text('''FROM node:22-alpine AS builder
          WORKDIR /app
          COPY . .
          RUN npm install
          RUN npm run build --workspace @timetable/worker

          FROM node:22-alpine AS runner
          WORKDIR /app
          ENV NODE_ENV=production
          COPY --from=builder /app/apps/worker/dist ./dist
          CMD ["node", "dist/index.js"]
          ''')

          Path("apps/solver/Dockerfile").write_text('''FROM python:3.11-slim

          ENV PYTHONDONTWRITEBYTECODE=1
          ENV PYTHONUNBUFFERED=1

          WORKDIR /app
          COPY apps/solver ./
          RUN pip install --no-cache-dir .

          EXPOSE 8000
          CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ''')

          Path("packages/database/Dockerfile").write_text('''FROM node:22-alpine
          WORKDIR /app
          COPY . .
          RUN npm install
          RUN npm run db:generate
          CMD ["npm", "run", "db:deploy"]
          ''')

          Path("compose.yaml").write_text('''services:
            postgres:
              image: postgres:16-alpine
              environment:
                POSTGRES_DB: ${POSTGRES_DB:-timetable}
                POSTGRES_USER: ${POSTGRES_USER:-timetable}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timetable}
              ports:
                - "5432:5432"
              volumes:
                - postgres-data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timetable} -d ${POSTGRES_DB:-timetable}"]
                interval: 5s
                timeout: 5s
                retries: 10

            migrate:
              build:
                context: .
                dockerfile: packages/database/Dockerfile
              environment:
                DATABASE_URL: ${DATABASE_URL:-postgresql://timetable:timetable@postgres:5432/timetable?schema=public}
              depends_on:
                postgres:
                  condition: service_healthy
              restart: "no"

            solver:
              build:
                context: .
                dockerfile: apps/solver/Dockerfile
              ports:
                - "8000:8000"
              healthcheck:
                test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
                interval: 10s
                timeout: 5s
                retries: 10

            web:
              build:
                context: .
                dockerfile: apps/web/Dockerfile
              environment:
                DATABASE_URL: ${DATABASE_URL:-postgresql://timetable:timetable@postgres:5432/timetable?schema=public}
                SOLVER_URL: ${SOLVER_URL:-http://solver:8000}
                WORKER_TOKEN: ${WORKER_TOKEN:-local-development-worker-token-change-me}
                NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Timetable}
              ports:
                - "3000:3000"
              depends_on:
                migrate:
                  condition: service_completed_successfully
                solver:
                  condition: service_healthy
              healthcheck:
                test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
                interval: 10s
                timeout: 5s
                retries: 10

            worker:
              build:
                context: .
                dockerfile: apps/worker/Dockerfile
              environment:
                WEB_INTERNAL_URL: ${WEB_INTERNAL_URL:-http://web:3000}
                SOLVER_URL: ${SOLVER_URL:-http://solver:8000}
                WORKER_TOKEN: ${WORKER_TOKEN:-local-development-worker-token-change-me}
                WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1500}
              depends_on:
                web:
                  condition: service_healthy
                solver:
                  condition: service_healthy
              restart: unless-stopped

          volumes:
            postgres-data:
          ''')
          PY

          mkdir -p packages/database/prisma/migrations/20260730000100_initial_schema
          if npx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel packages/database/prisma/schema.prisma \
            --script > /tmp/migration.sql 2>/tmp/migration-error.log; then
            mv /tmp/migration.sql packages/database/prisma/migrations/20260730000100_initial_schema/migration.sql
          else
            npx prisma migrate diff \
              --from-empty \
              --to-schema packages/database/prisma/schema.prisma \
              --script > packages/database/prisma/migrations/20260730000100_initial_schema/migration.sql
          fi
          printf 'provider = "postgresql"\n' > packages/database/prisma/migrations/migration_lock.toml
          npm run format
          git rm .github/workflows/prepare-mvp.yml
      - name: Commit prepared assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps packages compose.yaml .github/workflows/prepare-mvp.yml
          git commit -m "chore: add database migration and production containers"
          git push origin HEAD:${{ github.head_ref }}
