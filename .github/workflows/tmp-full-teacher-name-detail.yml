name: Apply full teacher name detail patch

on:
  push:
    branches:
      - agent/fix-vercel-solver-timeout-and-timetable-layout

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-vercel-solver-timeout-and-timetable-layout
          fetch-depth: 0
      - run: python scripts/tmp_full_teacher_name_detail.py
      - run: |
          npm ci
          npx prettier --write apps/web/app/timetable/page.tsx apps/web/e2e/subject-rotation-and-sports.spec.ts
      - run: |
          rm scripts/tmp_full_teacher_name_detail.py
          rm .github/workflows/tmp-full-teacher-name-detail.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: show full teacher name in timetable detail"
          git push origin HEAD:agent/fix-vercel-solver-timeout-and-timetable-layout
