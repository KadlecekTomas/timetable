name: Patch school-scale availability rows

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: python .github/scripts/patch_school_scale_availability.py
      - run: npx prettier --write apps/web/e2e/school-scale.spec.ts
      - run: npm run typecheck --workspace @timetable/web
      - name: Commit corrected school-scale availability
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/school-scale.spec.ts
          git commit -m "fix: keep school-scale availability inside each day"
          git push origin HEAD:${{ github.head_ref }}
