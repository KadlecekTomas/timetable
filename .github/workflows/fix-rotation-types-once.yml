name: Fix rotation TypeScript types once

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Normalize optional rotation types
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("apps/web/app/teaching-plan/page.tsx")
          content = page.read_text()
          content = content.replace(
              '''row.organization === "ROTATION"
                    ? row.secondarySubjectCode
                    : row.subjectCode,''',
              '''row.organization === "ROTATION"
                    ? (row.secondarySubjectCode ?? "")
                    : row.subjectCode,''',
              1,
          ).replace(
              '''row.organization === "ROTATION"
                    ? row.secondarySubjectCode
                    : row.subjectCode
                }''',
              '''row.organization === "ROTATION"
                    ? (row.secondarySubjectCode ?? "")
                    : row.subjectCode
                }''',
              1,
          )
          page.write_text(content)

          workbook = Path("apps/web/lib/import/teaching-plan-workbook.ts")
          content = workbook.read_text()
          content = content.replace(
              "  type TeachingPlanClass,\n",
              "",
              1,
          ).replace(
              "ORGANIZATION_LABELS[item.organization]",
              'ORGANIZATION_LABELS[item.organization as "WHOLE" | "SPLIT"]',
              1,
          )
          workbook.write_text(content)
          PY
      - run: npx prettier --write apps/web/app/teaching-plan/page.tsx apps/web/lib/import/teaching-plan-workbook.ts
      - name: Commit type fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/teaching-plan/page.tsx apps/web/lib/import/teaching-plan-workbook.ts
          git commit -m "fix(rotations): normalize optional subject types"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
