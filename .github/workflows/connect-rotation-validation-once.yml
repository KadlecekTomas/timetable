name: Connect browser rotation validator once

on:
  pull_request:

permissions:
  contents: write

jobs:
  connect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: python .github/scripts/connect-rotation-validation.py
      - run: npx prettier --write apps/web/lib/domain/validation.ts apps/web/lib/domain/rotation-validation.ts
      - name: Commit validator connection
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/domain/validation.ts apps/web/lib/domain/rotation-validation.ts
          git commit -m "fix(domain): enforce rotations after generation and manual moves"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
