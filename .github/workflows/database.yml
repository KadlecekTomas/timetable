name: Database

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: timetable
          POSTGRES_USER: timetable
          POSTGRES_PASSWORD: timetable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timetable -d timetable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://timetable:timetable@localhost:5432/timetable?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
      - name: Verify migrated schema is queryable
        run: |
          node <<'NODE'
          const { PrismaClient } = require("@prisma/client");
          const prisma = new PrismaClient();

          async function main() {
            await prisma.school.count();
            const migrations = await prisma.$queryRawUnsafe(
              'SELECT migration_name FROM "_prisma_migrations" WHERE finished_at IS NOT NULL',
            );
            if (!Array.isArray(migrations) || migrations.length !== 1) {
              throw new Error(`Expected exactly one applied migration, got ${migrations.length}`);
            }
          }

          main().finally(() => prisma.$disconnect());
          NODE
      - run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
      - run: npx prisma migrate status --schema packages/database/prisma/schema.prisma
