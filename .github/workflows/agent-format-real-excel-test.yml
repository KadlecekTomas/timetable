name: Agent format exact Excel regression test

on:
  push:
    branches:
      - agent/fix-real-excel-generation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-real-excel-generation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Format exact regression test
        run: npx prettier --write apps/web/tests/real-legacy-excel-generation.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/real-legacy-excel-generation.test.ts
          git commit -m "test: format exact Excel regression"
          git push origin HEAD:agent/fix-real-excel-generation
