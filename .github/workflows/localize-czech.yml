name: Localize Czech interface

on:
  pull_request:

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Replace user-facing English and technical labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Missing expected text in {path}: {old!r}")
              file.write_text(text.replace(old, new))

          replace(
              "apps/web/components/app-shell.tsx",
              '{ label: "Import", icon: Upload, href: "/import" },',
              '{ label: "Načtení dat", icon: Upload, href: "/import" },',
          )
          replace(
              "apps/web/components/app-shell.tsx",
              '{ label: "Generátor", icon: ClipboardCheck, href: "/generate" },',
              '{ label: "Tvorba rozvrhu", icon: ClipboardCheck, href: "/generate" },',
          )
          replace("apps/web/components/app-shell.tsx", "\n             T\n", "\n             R\n")
          replace("apps/web/components/app-shell.tsx", "Timetable", "Rozvrhář")
          replace(
              "apps/web/components/app-shell.tsx",
              "Školní rozvrhy",
              "Tvorba školních rozvrhů",
          )
          replace(
              "apps/web/components/app-shell.tsx",
              "MVP pracovní prostředí",
              "Pracovní prostředí",
          )

          replace("apps/web/app/layout.tsx", 'title: "Timetable",', 'title: "Rozvrhář",')
          replace(
              "apps/web/app/layout.tsx",
              'description: "AI-assisted school timetable generator",',
              'description: "Tvorba školních rozvrhů s podporou automatického plánování",',
          )

          replace("apps/web/app/page.tsx", "Importovat Excel", "Načíst data z Excelu")
          replace("apps/web/app/page.tsx", "Spustit generování", "Vytvořit rozvrh")
          replace(
              "apps/web/app/page.tsx",
              "Entity, které vstupují do readiness kontroly a immutable\n                   solver snapshotu.",
              "Údaje, které vstupují do kontroly připravenosti a neměnného\n                   zadání pro tvorbu rozvrhu.",
          )
          replace(
              "apps/web/app/page.tsx",
              "Generování lze spustit",
              "Rozvrh lze vytvořit",
          )
          replace(
              "apps/web/app/page.tsx",
              "Načítám readiness kontrolu…",
              "Načítám kontrolu připravenosti…",
          )

          replace(
              "apps/web/app/data/page.tsx",
              'import { StatusBadge } from "@/components/ui/status-badge";',
              'import { StatusBadge } from "@/components/ui/status-badge";\nimport {\n  availabilityKindLabels,\n  entityTypeLabels,\n  lessonShapeLabels,\n  teachingGroupLabels,\n} from "@/lib/ui-labels";',
          )
          replace(
              "apps/web/app/data/page.tsx",
              '  return `${textValue(record, "entityType")} · ${textValue(record, "kind")}`;',
              '  const entityType = textValue(record, "entityType");\n  const kind = textValue(record, "kind");\n  return `${entityTypeLabels[entityType] ?? entityType} · ${availabilityKindLabels[kind] ?? kind}`;',
          )
          replace(
              "apps/web/app/data/page.tsx",
              'description="Ruční správa stabilních číselníků a vazeb. Stejná data používá import, readiness kontrola i solver."',
              'description="Ruční správa stabilních číselníků a vazeb. Stejná data používá načtení z Excelu, kontrola připravenosti i automatická tvorba rozvrhu."',
          )
          replace(
              "apps/web/app/data/page.tsx",
              '["WHOLE", "GROUP_1", "GROUP_2"].map((value) => ({\n             value,\n             label: value,\n           }))',
              '["WHOLE", "GROUP_1", "GROUP_2"].map((value) => ({\n             value,\n             label: teachingGroupLabels[value] ?? value,\n           }))',
          )
          replace(
              "apps/web/app/data/page.tsx",
              '["SINGLE", "DOUBLE", "MIXED"].map((value) => ({\n             value,\n             label: value,\n           }))',
              '["SINGLE", "DOUBLE", "MIXED"].map((value) => ({\n             value,\n             label: lessonShapeLabels[value] ?? value,\n           }))',
          )
          replace("apps/web/app/data/page.tsx", '        "Entita",', '        "Položka",')
          replace(
              "apps/web/app/data/page.tsx",
              'field("period", "Index hodiny (0 = první)", "number")',
              'field("period", "Pořadí hodiny (0 = první)", "number")',
          )
          replace(
              "apps/web/app/data/page.tsx",
              '["UNAVAILABLE", "PREFERRED", "DISCOURAGED"].map((value) => ({\n           value,\n           label: value,\n         }))',
              '["UNAVAILABLE", "PREFERRED", "DISCOURAGED"].map((value) => ({\n           value,\n           label: availabilityKindLabels[value] ?? value,\n         }))',
          )

          replace(
              "apps/web/app/import/page.tsx",
              'import { StatusBadge } from "@/components/ui/status-badge";',
              'import { StatusBadge } from "@/components/ui/status-badge";\nimport { importSeverityLabels, importSummaryLabels } from "@/lib/ui-labels";',
          )
          replace("apps/web/app/import/page.tsx", "Analýza importu selhala.", "Analýza souboru selhala.")
          replace(
              "apps/web/app/import/page.tsx",
              "Potvrzení importu selhalo.",
              "Uložení načtených dat selhalo.",
          )
          replace(
              "apps/web/app/import/page.tsx",
              "Import vždy patří ke konkrétnímu školnímu roku.",
              "Načtená data vždy patří ke konkrétnímu školnímu roku.",
          )
          replace("apps/web/app/import/page.tsx", 'title="Excel import"', 'title="Načtení dat z Excelu"')
          replace(
              "apps/web/app/import/page.tsx",
              'description="Soubor se nejprve analyzuje bez zápisu. Potvrzení je dostupné pouze pro náhled bez blokujících chyb."',
              'description="Soubor se nejprve zkontroluje bez zápisu. Uložení je dostupné pouze pro náhled bez blokujících chyb."',
          )
          replace(
              "apps/web/app/import/page.tsx",
              'fileName || "Vyberte vyplněný Excel"',
              'fileName || "Vyberte vyplněný soubor Excel"',
          )
          replace(
              "apps/web/app/import/page.tsx",
              '"Import byl atomicky potvrzen"',
              '"Data byla bezpečně uložena"',
          )
          replace(
              "apps/web/app/import/page.tsx",
              '"Náhled je připraven k potvrzení"',
              '"Náhled je připraven k uložení"',
          )
          replace(
              "apps/web/app/import/page.tsx",
              '"Import obsahuje blokující chyby"',
              '"Soubor obsahuje blokující chyby"',
          )
          replace(
              "apps/web/app/import/page.tsx",
              'Batch {result.importBatchId}',
              'Dávka {result.importBatchId}',
          )
          replace(
              "apps/web/app/import/page.tsx",
              '<p className="text-xs text-text-muted">{key}</p>',
              '<p className="text-xs text-text-muted">\n                     {importSummaryLabels[key] ?? key}\n                   </p>',
          )
          replace(
              "apps/web/app/import/page.tsx",
              '{issue.severity}\n                           </StatusBadge>',
              '{importSeverityLabels[issue.severity] ?? issue.severity}\n                           </StatusBadge>',
          )
          replace(
              "apps/web/app/import/page.tsx",
              '{busy ? "Potvrzuji…" : "Potvrdit změny atomicky"}',
              '{busy ? "Ukládám…" : "Bezpečně uložit změny"}',
          )

          replace(
              "apps/web/app/generate/page.tsx",
              'import type { ReadinessReport } from "@/lib/domain/contracts";',
              'import type { ReadinessReport } from "@/lib/domain/contracts";\nimport { generationStatusLabels } from "@/lib/ui-labels";',
          )
          replace(
              "apps/web/app/generate/page.tsx",
              "Generování se nepodařilo zařadit.",
              "Úlohu se nepodařilo zařadit ke zpracování.",
          )
          replace("apps/web/app/generate/page.tsx", "Běh nelze zrušit.", "Výpočet nelze zrušit.")
          replace("apps/web/app/generate/page.tsx", 'title="Generátor rozvrhu"', 'title="Tvorba rozvrhu"')
          replace(
              "apps/web/app/generate/page.tsx",
              'description="Job se uloží do databázové fronty. Worker zobrazí skutečnou fázi běhu; aplikace nevymýšlí procenta, která solver nezná."',
              'description="Úloha se uloží do fronty zpracování. Aplikace zobrazuje skutečnou fázi výpočtu a nevymýšlí procenta, která plánovací modul nezná."',
          )
          replace(
              "apps/web/app/generate/page.tsx",
              '"Předletová kontrola prošla"',
              '"Kontrola připravenosti prošla"',
          )
          replace(
              "apps/web/app/generate/page.tsx",
              '"Předletová kontrola blokuje běh"',
              '"Kontrola připravenosti blokuje tvorbu"',
          )
          replace(
              "apps/web/app/generate/page.tsx",
              "Načítám readiness kontrolu…",
              "Načítám kontrolu připravenosti…",
          )
          replace(
              "apps/web/app/generate/page.tsx",
              "Časový limit solveru",
              "Časový limit výpočtu",
          )
          replace(
              "apps/web/app/generate/page.tsx",
              "Běhy generování",
              "Průběh tvorby rozvrhu",
          )
          replace(
              "apps/web/app/generate/page.tsx",
              "Immutable vstupy, lifecycle a kandidátní verze.",
              "Neměnné vstupy, průběh zpracování a výsledná verze.",
          )
          replace(
              "apps/web/app/generate/page.tsx",
              "{run.status}\n                       </StatusBadge>",
              "{generationStatusLabels[run.status] ?? run.status}\n                       </StatusBadge>",
          )
          replace(
              "apps/web/app/generate/page.tsx",
              "Zatím nebyl spuštěn žádný běh.",
              "Zatím nebyla spuštěna žádná tvorba rozvrhu.",
          )

          replace(
              "apps/web/app/timetable/page.tsx",
              'import { StatusBadge } from "@/components/ui/status-badge";',
              'import { StatusBadge } from "@/components/ui/status-badge";\nimport { teachingGroupLabels } from "@/lib/ui-labels";',
          )
          replace(
              "apps/web/app/timetable/page.tsx",
              'setError(data.error?.message ?? "Undo nelze provést.");',
              'setError(data.error?.message ?? "Poslední změnu nelze vrátit.");',
          )
          replace(
              "apps/web/app/timetable/page.tsx",
              "Zatím není dostupný kandidátní rozvrh",
              "Zatím není dostupný návrh rozvrhu",
          )
          replace(
              "apps/web/app/timetable/page.tsx",
              'title={payload?.version.name ?? "Editor rozvrhu"}',
              'title={payload?.version.name ?? "Úprava rozvrhu"}',
          )
          replace(
              "apps/web/app/timetable/page.tsx",
              'description="Dialogový přesun používá stejný serverový hard-validátor jako solver. Zamčené bloky nelze přesunout."',
              'description="Přesun ověřuje stejná serverová kontrola pevných pravidel jako automatická tvorba rozvrhu. Zamčené bloky nelze přesunout."',
          )
          replace("apps/web/app/timetable/page.tsx", "               Undo", "               Vrátit změnu")
          replace(
              "apps/web/app/timetable/page.tsx",
              "Revision {payload.version.revision}",
              "Verze úprav {payload.version.revision}",
          )
          replace(
              "apps/web/app/timetable/page.tsx",
              '? ` · ${lesson.group}`',
              '? ` · ${teachingGroupLabels[lesson.group] ?? lesson.group}`',
          )

          for test_file in [
              "apps/web/e2e/mvp-flow.spec.ts",
              "apps/web/e2e/visual-gallery.spec.ts",
          ]:
              replace(test_file, "Náhled je připraven k potvrzení", "Náhled je připraven k uložení")
              replace(test_file, "Potvrdit změny atomicky", "Bezpečně uložit změny")
              replace(test_file, "Import byl atomicky potvrzen", "Data byla bezpečně uložena")
              replace(test_file, "Předletová kontrola prošla", "Kontrola připravenosti prošla")
              replace(test_file, "/^(FEASIBLE|OPTIMAL)$/", "/^(Proveditelný návrh|Optimální návrh)$/")

          replace(
              "apps/web/e2e/visual-gallery.spec.ts",
              "Generování lze spustit",
              "Rozvrh lze vytvořit",
          )
          replace(
              "apps/web/e2e/mvp-flow.spec.ts",
              "`Revision ${initial.version.revision + 1}`",
              "`Verze úprav ${initial.version.revision + 1}`",
          )
          replace(
              "apps/web/e2e/mvp-flow.spec.ts",
              '{ name: "Undo" }',
              '{ name: "Vrátit změnu" }',
          )
          PY
      - run: npx prettier --write apps/web .github/workflows/localize-czech.yml
      - name: Commit Czech interface
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web
          git commit -m "feat: localize interface completely to Czech"
          git push origin HEAD:${{ github.head_ref }}
