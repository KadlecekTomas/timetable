name: Format subject rotations once

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm install
      - run: npx prettier --write apps/web/app/teaching-plan/page.tsx apps/web/lib/local/teaching-plan.ts
      - run: pip install ruff==0.12.10
      - run: ruff check --fix apps/solver/app/class_groups.py apps/solver/app/models.py && ruff format apps/solver/app/class_groups.py apps/solver/app/models.py
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/teaching-plan/page.tsx apps/web/lib/local/teaching-plan.ts apps/solver/app/class_groups.py apps/solver/app/models.py
          git commit -m "style(rotations): apply canonical formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
