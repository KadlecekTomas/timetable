name: Restore browser workbook helper

on:
  push:
    branches: [feat/local-first-indexeddb]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-first-indexeddb
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore verified source and make buffers browser compatible
        shell: bash
        run: |
          git show 636b6515843e97916759e25171c6bb8571333a1b:apps/web/lib/import/workbook.ts > apps/web/lib/import/workbook.ts
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/lib/import/workbook.ts')
          text = path.read_text()
          text = text.replace(
              'export async function createImportTemplate(): Promise<Buffer> {',
              'export async function createImportTemplate(): Promise<Uint8Array> {',
          )
          text = text.replace(
              'return Buffer.from(await workbook.xlsx.writeBuffer());',
              'return new Uint8Array(await workbook.xlsx.writeBuffer());',
          )
          text = text.replace(
              'export async function analyzeImportWorkbook(\n  buffer: Buffer,',
              'export async function analyzeImportWorkbook(\n  buffer: ArrayBuffer | Uint8Array,',
          )
          path.write_text(text)
          PY
      - run: npx prettier --write apps/web/lib/import/workbook.ts
      - name: Commit restored helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/import/workbook.ts
          git commit -m "refactor: make Excel import browser compatible"
          git push origin HEAD:feat/local-first-indexeddb
