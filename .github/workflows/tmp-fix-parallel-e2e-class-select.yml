name: Fix parallel E2E class selection

on:
  push:
    branches:
      - agent/fix-vercel-solver-timeout-and-timetable-layout

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-vercel-solver-timeout-and-timetable-layout
          fetch-depth: 0
      - run: python scripts/tmp_fix_parallel_e2e_class_select.py
      - run: npx prettier --write apps/web/e2e/subject-rotation-and-sports.spec.ts
      - run: |
          rm scripts/tmp_fix_parallel_e2e_class_select.py
          rm .github/workflows/tmp-fix-parallel-e2e-class-select.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: select 6.B by visible class code"
          git push origin HEAD:agent/fix-vercel-solver-timeout-and-timetable-layout
