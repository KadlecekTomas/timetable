name: Format feasibility-first UI change

on:
  push:
    branches:
      - agent/feasibility-first-solver

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/feasibility-first-solver
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/web/app/generate/page.tsx
      - name: Commit formatting and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/generate/page.tsx
          git rm .github/workflows/format-feasibility-first.yml
          git commit -m "Format feasibility-first generation UI"
          git push origin HEAD:agent/feasibility-first-solver
