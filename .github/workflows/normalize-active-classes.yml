name: Normalize active classes artifact

on:
  pull_request:
    branches:
      - main

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/web/lib/import/teaching-plan-workbook-school-final.ts')
          text = path.read_text()
          replacement = '''  const rows = [...withoutReplacedRows.rows, ...shared.rows];
          const activeClassCodes = new Set(
            rows.flatMap((row) => [
              row.classCode,
              ...(row.additionalClassCodes ?? []),
            ]),
          );
          const seenClassCodes = new Set<string>();
          const plan: TeachingPlan = {
            ...withoutReplacedRows,
            classes: withoutReplacedRows.classes.filter((schoolClass) => {
              if (
                !activeClassCodes.has(schoolClass.code) ||
                seenClassCodes.has(schoolClass.code)
              ) {
                return false;
              }
              seenClassCodes.add(schoolClass.code);
              return true;
            }),
            rows,
          };
          const validationIssues = validateTeachingPlan(plan, staffingPlan).map('''
          text, count = re.subn(
              r'  const plan: TeachingPlan = \{\n    \.\.\.withoutReplacedRows,\n    rows: \[\.\.\.withoutReplacedRows\.rows, \.\.\.shared\.rows\],\n  \};\n  const validationIssues = validateTeachingPlan\(plan, staffingPlan\)\.map\(',
              replacement,
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'plan block replacements: {count}')
          text, count = re.subn(
              r'    summary: \{\n      \.\.\.legacy\.summary,\n      subjects: plan\.rows\.length,',
              '    summary: {\n      ...legacy.summary,\n      classes: plan.classes.length,\n      subjects: plan.rows.length,',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'summary block replacements: {count}')
          path.write_text(text)
          PY
      - run: npx prettier --write apps/web/lib/import/teaching-plan-workbook-school-final.ts
      - uses: actions/upload-artifact@v4
        with:
          name: normalized-active-classes
          path: apps/web/lib/import/teaching-plan-workbook-school-final.ts
