name: Format mandatory split hotfix

on:
  push:
    branches:
      - fix/mandatory-split-coverage

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mandatory-split-coverage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write apps/web/lib/local/teaching-plan-school-v3.ts apps/web/tests/mandatory-school-splits.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/local/teaching-plan-school-v3.ts apps/web/tests/mandatory-school-splits.test.ts
          git commit -m "style: format mandatory split rules"
          git push origin HEAD:fix/mandatory-split-coverage
