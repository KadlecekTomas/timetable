name: Clean generated artifacts

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Remove generated files from version control
        run: |
          git rm -r --cached --ignore-unmatch apps/solver/build
          git rm -r --cached --ignore-unmatch apps/solver/timetable_solver.egg-info
          git rm --cached --ignore-unmatch apps/web/tsconfig.tsbuildinfo
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove generated build artifacts"
          git push origin HEAD:${{ github.head_ref }}
