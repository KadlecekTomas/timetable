name: Reset imported classes artifact

on:
  pull_request:
    branches:
      - main

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/lib/import/teaching-plan-workbook.ts')
          text = path.read_text()
          old = '  const plan = createEmptyTeachingPlan();\n\n  if (!classesSheet || !planSheet) {'
          new = '  const plan = createEmptyTeachingPlan();\n  plan.classes = [];\n\n  if (!classesSheet || !planSheet) {'
          if text.count(old) != 1:
              raise SystemExit(f'expected one analyzer initialization, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - run: npx prettier --write apps/web/lib/import/teaching-plan-workbook.ts
      - uses: actions/upload-artifact@v4
        with:
          name: reset-imported-classes
          path: apps/web/lib/import/teaching-plan-workbook.ts
