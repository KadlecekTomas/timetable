name: Simplify rotation workbook check once

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: python .github/scripts/simplify-rotation-workbook-check.py
      - run: npx prettier --write apps/web/lib/import/teaching-plan-workbook.ts
      - name: Commit compatible workbook formula
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/import/teaching-plan-workbook.ts
          git commit -m "fix(excel): simplify rotation validation formula"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
